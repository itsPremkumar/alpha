# Full $0 long-term memory -- copy into your local `config.yaml`.
#
# Stack: DeerMem (durable default) + mem0oss (local OSS Mem0 + Ollama,
# Apache-2.0) + wiki vault (compiled Markdown, zero deps). No API keys.
#
# Prerequisites for full quality (else graceful stub mode):
#   ollama pull llama3.1 nomic-embed-text
#   cd backend && uv pip install 'agent_workspace-harness[mem0oss]'
#   # mem0oss extra = ["mem0ai", "ollama", "qdrant-client"]
#
# memory:
#   enabled: true
#   injection_enabled: true
#   manager_class: fullmemory
#   mode: middleware
#   backend_config:
#     storage_path: .agent-workspace/data
#     top_k: 8
#     max_injection_chars: 12000
#     wiki_enabled: true
#     wiki_max_chars: 2000
#     mem0oss_enabled: true
#     mem0oss:
#       llm_provider: ollama
#       llm_model: llama3.1:latest
#       ollama_base_url: http://localhost:11434
#       embedder_provider: ollama
#       embed_model: nomic-embed-text:latest
#       embedding_dims: 768
#       vector_collection: agent_workspace_memory
#       startup_policy: tolerate
#       failure_policy: {read: fail_open, write: log_and_drop}
#
# Facts-only alternative (no wiki, no DeerMem):
# memory:
#   manager_class: mem0oss
#   backend_config:
#     ollama_base_url: http://localhost:11434
#     startup_policy: tolerate
