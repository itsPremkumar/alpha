[project]
name = "agent-workspace-extension-api"
version = "0.2.0"
description = "Public contracts for Alpha extensions"
requires-python = ">=3.12"
# Keep the contract package import-light and independent from the host. Public
# values are stdlib-based; concrete middleware types are validated by Alpha.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_workspace_extension_api"]
