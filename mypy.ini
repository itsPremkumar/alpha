[mypy]
# Lenient profile: surface real type errors without drowning in strictness
# noise on a not-yet-fully-typed codebase.
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
# Exclude tests from type errors (too noisy), keep them in vulture/ruff.
#
# The patterns are on ONE line and start with (^|/) on purpose. Two separate
# defects kept this exclusion from ever applying:
#
#   1. It was written as a multi-line (?x) PCRE block, which configparser cannot
#      parse - the closing ")" on its own line made the whole file be rejected
#      with "Source contains parsing errors".
#   2. A leading "/tests/" only matches a root-anchored path, but the config file
#      lives at the repo root while CI runs `uv run mypy .` from backend/, so the
#      scanned paths are "tests/conftest.py" with no leading slash. The exclusion
#      silently matched nothing.
#
# Because it never applied, mypy scanned tests/ and died on two conftest.py files
# both mapping to the module name "conftest". The type check therefore never ran,
# and CI stayed green only because the step ended in `|| true`.
exclude = (^|/)(tests|__pycache__|\.venv)/
