[mypy]
# Lenient profile: surface real type errors without drowning in strictness
# noise on a not-yet-fully-typed codebase.
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
# Exclude tests from type errors (too noisy), keep them in vulture/ruff.
exclude = (?x)(
    /tests/
    | /__pycache__/
    | /\.venv/
)
