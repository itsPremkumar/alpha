# Alpha Production Environment
# Usage: make up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI Gateway API + agent runtime
#   - redis:       Redis Streams backend for cross-worker SSE stream bridge
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   AGENT_WORKSPACE_PROJECT_ROOT           — project root for relative runtime paths
#   AGENT_WORKSPACE_HOME                   — runtime data dir, default .agent-workspace under $AGENT_WORKSPACE_PROJECT_ROOT (or cwd)
#   AGENT_WORKSPACE_CONFIG_PATH            — path to config.yaml
#   AGENT_WORKSPACE_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   AGENT_WORKSPACE_SKILLS_PATH            — skills dir, default $AGENT_WORKSPACE_PROJECT_ROOT/skills
#   AGENT_WORKSPACE_DOCKER_SOCKET          — Docker socket path for aio/DooD mode, default /var/run/docker.sock (used only by the opt-in docker-compose.dood.yaml overlay)
#   AGENT_WORKSPACE_REPO_ROOT              — repo root (used for skills host path in DooD)
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#   AGENT_WORKSPACE_INTERNAL_AUTH_TOKEN    — shared internal Gateway auth token for multi-worker IM channels
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Redis Stream Bridge ────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: agent-workspace-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - agent-workspace
    restart: unless-stopped

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: agent-workspace-nginx
    # Loopback-only by default: Alpha's agent can execute commands, so the
    # documented default deployment is a local trusted environment. A bare
    # "${PORT}:2026" would bind 0.0.0.0 instead, which does not match that.
    # Set BIND_HOST=0.0.0.0 only behind your own TLS/auth front door, and
    # complete first-run setup before the host becomes reachable.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      frontend:
        condition: service_started
      gateway:
        condition: service_healthy
    networks:
      - agent-workspace
    restart: unless-stopped

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: agent-workspace-frontend
    environment:
      # Must be set HERE: install.sh writes NODE_ENV=development into
      # frontend/.env for local dev, and env_file beats the image's ENV, so
      # without this override the production container boots Next.js with a
      # development NODE_ENV. environment: > env_file in compose precedence.
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - AGENT_WORKSPACE_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    # required:false keeps `docker compose up` working on a fresh clone that
    # has not created frontend/.env yet (deploy.sh generates what is needed).
    env_file:
      - path: ../frontend/.env
        required: false
    networks:
      - agent-workspace
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.1}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        LARK_CLI_NPM_VERSION: ${LARK_CLI_NPM_VERSION:-1.0.65}
    container_name: agent-workspace-gateway
    ports:
      # Optional LAN discovery beacon. Set BIND_HOST=0.0.0.0 only when this
      # installation is intentionally reachable by other Alpha peers.
      - "${BIND_HOST:-127.0.0.1}:${ALPHA_PEER_NETWORK_DISCOVERY_PORT:-8743}:${ALPHA_PEER_NETWORK_DISCOVERY_PORT:-8743}/udp"
    # Gateway hosts the agent runtime with in-process RunManager + StreamBridge
    # singletons -- run state lives in this worker's memory. Default to a single
    # worker: the Redis stream bridge solves cross-worker SSE delivery and
    # reconnect, but run cancel, request dedup, and per-worker IM channel
    # services remain worker-local. Override GATEWAY_WORKERS only when the
    # Redis stream bridge is enabled and those limitations are acceptable.
    command: sh -c "cd backend && PYTHONPATH=. uv run --no-sync uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-1}"
    volumes:
      # Defaults keep a fresh clone runnable without pre-exporting variables:
      # an UNSET variable used to expand to an empty bind source, which makes
      # Docker mount a directory where a file is expected (or fail outright).
      - ${AGENT_WORKSPACE_CONFIG_PATH:-../config.yaml}:/app/backend/config.yaml:ro
      # Writable on purpose: the Gateway edits this file at runtime (MCP
      # enable/disable, PUT/PATCH /api/mcp/config, skill updates). config.yaml
      # above stays read-only because no API writes it.
      - ${AGENT_WORKSPACE_EXTENSIONS_CONFIG_PATH:-../extensions_config.json}:/app/backend/extensions_config.json
      - ../skills:/app/skills:ro
      - ${AGENT_WORKSPACE_HOME:-../.agent-workspace}:/app/backend/.agent-workspace
      # DooD: the host Docker socket is NOT mounted by default. It is added only
      # for aio (pure-DooD) sandbox mode via the opt-in docker-compose.dood.yaml
      # overlay (appended by scripts/deploy.sh). See backend/docs/CONFIGURATION.md
      # Security Note section for details.
       
      # CLI auth dirs (Claude Code / Codex) are NOT mounted by default: they
      # expose the entire ~/.claude and ~/.codex (history, projects, global
      # config, credentials) into the container. Mount them only when you use
      # the Claude/Codex CLI login as a model provider or ACP agent, via the
      # opt-in docker-compose.cli-auth.yaml overlay. Prefer an env token
      # (CLAUDE_CODE_OAUTH_TOKEN, see .env.example / backend/docs/CONFIGURATION.md).
    working_dir: /app
    environment:
      - CI=true
      - AGENT_WORKSPACE_PROJECT_ROOT=/app
      - AGENT_WORKSPACE_HOME=/app/backend/.agent-workspace
      - AGENT_WORKSPACE_CONFIG_PATH=/app/backend/config.yaml
      - AGENT_WORKSPACE_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - ALPHA_PEER_NETWORK_ENABLED=${ALPHA_PEER_NETWORK_ENABLED:-1}
      - ALPHA_PEER_NETWORK_BIND_HOST=${ALPHA_PEER_NETWORK_BIND_HOST:-0.0.0.0}
      - ALPHA_PEER_NETWORK_DISCOVERY_PORT=${ALPHA_PEER_NETWORK_DISCOVERY_PORT:-8743}
      - ALPHA_PEER_NETWORK_ADVERTISED_BASE_URL=${ALPHA_PEER_NETWORK_ADVERTISED_BASE_URL:-}
      - ALPHA_PEER_NETWORK_GITHUB_REPO=${ALPHA_PEER_NETWORK_GITHUB_REPO:-}
      - ALPHA_PEER_NETWORK_GITHUB_BRANCH=${ALPHA_PEER_NETWORK_GITHUB_BRANCH:-main}
      - ALPHA_PEER_NETWORK_GITHUB_DIRECTORY=${ALPHA_PEER_NETWORK_GITHUB_DIRECTORY:-.alpha-network/peers}
      - ALPHA_PEER_NETWORK_GITHUB_TOKEN=${ALPHA_PEER_NETWORK_GITHUB_TOKEN:-}
      - AGENT_WORKSPACE_STREAM_BRIDGE_REDIS_URL=${AGENT_WORKSPACE_STREAM_BRIDGE_REDIS_URL:-redis://redis:6379/0}
      - AGENT_WORKSPACE_CHANNELS_LANGGRAPH_URL=${AGENT_WORKSPACE_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - AGENT_WORKSPACE_CHANNELS_GATEWAY_URL=${AGENT_WORKSPACE_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - AGENT_WORKSPACE_INTERNAL_AUTH_TOKEN=${AGENT_WORKSPACE_INTERNAL_AUTH_TOKEN}
      # DooD path/network translation
      - AGENT_WORKSPACE_HOST_BASE_DIR=${AGENT_WORKSPACE_HOME:-../.agent-workspace}
      - AGENT_WORKSPACE_SANDBOX_HOST=host.docker.internal
      # Proxy values (HTTP_PROXY/HTTPS_PROXY/ALL_PROXY) are inherited from ../.env via env_file.
      # Only NO_PROXY is declared here so internal service hostnames are always exempt from the proxy.
      # env_file not listed here: required:false (same fresh-clone reason as
      # the frontend service) is applied via the shared ../.env reference
      # below, which deploy.sh also augments with generated secrets.
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,openviking,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,openviking,host.docker.internal
    env_file:
      - path: ../.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # /health/ready runs both probes concurrently within a 3s endpoint
      # deadline; the client timeout must stay above that bound.
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - agent-workspace
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: agent-workspace-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=agent-workspace
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      # Optional lark-cli init image (Pattern A). Empty ⇒ legacy runtime mount.
      # Set to a published tag (e.g. agent-workspace/lark-cli-init:v1.0.65) to provision
      # the sandbox lark-cli runtime via an init container + emptyDir.
      - LARK_CLI_INIT_IMAGE=${LARK_CLI_INIT_IMAGE:-}
      # Optional lark-cli broker image (Pattern B, issue #4338). When set, the
      # sandbox gets a shim + broker sidecar that holds the credentials, so the
      # plaintext config/data are never mounted into the sandbox. Supersedes
      # LARK_CLI_INIT_IMAGE when both are set. Empty ⇒ broker off.
      - LARK_CLI_BROKER_IMAGE=${LARK_CLI_BROKER_IMAGE:-}
      - THREADS_HOST_PATH=${AGENT_WORKSPACE_HOME:-../.agent-workspace}/threads
      - AGENT_WORKSPACE_HOST_BASE_DIR=${AGENT_WORKSPACE_HOME:-../.agent-workspace}
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - path: ../.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  redis-data:

networks:
  agent-workspace:
    driver: bridge
