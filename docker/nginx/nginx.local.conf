# Global error_log (main context). Without this, nginx opens its compiled-in
# default (/var/log/nginx/error.log) at startup before reaching the http-block
# error_log, which fails with permission denied when run as a non-root user.
error_log logs/nginx-error.log warn;
events {
    worker_connections 1024;
}
pid logs/nginx.pid;
http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compress textual delivery only. SSE and already-compressed media are
    # deliberately absent because buffering/compression hurts their latency.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Logging
    access_log logs/nginx-access.log;
    error_log logs/nginx-error.log;

    # Upstream servers (using 127.0.0.1 for local development)
    upstream gateway {
        server 127.0.0.1:8001;
        # Reuse upstream connections. Safe *here* and only here: the address is
        # a stable loopback IP with no DNS to go stale, whereas nginx.conf
        # resolves its gateway per request to survive container IP changes.
        # The pool only engages for locations that clear the hop-by-hop
        # `Connection` header below (HTTP/1.1 is already set on every gateway
        # location); without that nginx sends `Connection: close` per request
        # and a keepalive pool would be dead configuration.
        keepalive 32;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    # Only mark frontend requests as connection upgrades when the browser
    # actually requested one. Next.js dev HMR also uses long-lived HTTP
    # streams, and forcing "Connection: upgrade" on those requests makes
    # nginx treat the upstream response as an invalid upgrade handshake.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 2026;
        listen [::]:2026;
        server_name _;

        # -- Coded upstream failures -------------------------------------
        # A bare nginx 502 is an HTML page with no machine-readable body, so
        # `api-client.ts` could only report "HTTP 502" and the operator had no
        # way to tell a proxy failure from any other failed request. These two
        # targets return the same JSON shape FastAPI uses (`detail` plus a
        # stable `error_code`), so the client classifies a real payload.
        #
        # 502 and 504 are separate targets rather than one body with a
        # hardcoded status: "gateway unavailable" and "gateway timed out" are
        # different operator problems and must not report the same number.
        #
        # 503 is deliberately NOT intercepted. A 503 that reaches a client here
        # is generated by the *Gateway* (an MCP worker-stopped cancel, an
        # admission refusal), carries a payload the client acts on, and nginx
        # never generates one for a proxied request. Replacing it with a proxy
        # message would delete the server's own reason. Only the two statuses
        # nginx itself produces are ours to render.
        #
        # SSE safety: `error_page` only ever replaces the *initial* response.
        # A stream that already delivered `200 text/event-stream` and then drops
        # is a socket error, not an HTTP status, so no frame can be rewritten
        # mid-flight. A stream whose gateway is down fails at the initial
        # response and now receives this coded JSON instead of an opaque HTML
        # page, which is strictly better for the client: it is exactly the case
        # `consumeChatStream`'s reconnect ladder has to classify.
        proxy_intercept_errors on;
        error_page 502 = @gateway_bad_gateway;
        error_page 504 = @gateway_timeout;

        @gateway_bad_gateway {
            default_type application/json;
            return 502 '{"detail": "gateway unavailable", "error_code": "proxy_upstream_down", "http_status": 502}';
        }

        @gateway_timeout {
            default_type application/json;
            return 504 '{"detail": "gateway timed out", "error_code": "proxy_upstream_timeout", "http_status": 504}';
        }

        # Keep the unified nginx endpoint same-origin by default. When split
        # frontend/backend or port-forwarded deployments need browser CORS,
        # configure the Gateway allowlist with GATEWAY_CORS_ORIGINS so CORS and
        # CSRF origin checks stay aligned instead of approving every origin at
        # the proxy layer.

        # LangGraph-compatible API routes served by Gateway.
        # Rewrites /api/langgraph/* to /api/* before proxying to Gateway.
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://gateway;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # SSE/Streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;

            # Long chat/text-prompt support (issue #3952): a sufficiently long
            # pasted prompt otherwise exceeds nginx's default 1m
            # client_max_body_size, or gets spooled to a temp file via
            # proxy_request_buffering before reaching Gateway -- on a non-root
            # local run that temp directory may not be writable, producing a
            # raw nginx 500 instead of a graceful application error. Mirrors
            # the uploads location's fix below (same mechanism, sized for text
            # prompts rather than binary file uploads).
            client_max_body_size 20M;
            proxy_request_buffering off;

            # Timeouts for long-running requests
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # Custom API: Models endpoint
        location /api/models {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: Memory endpoint
        location /api/memory {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: MCP configuration endpoint
        location /api/mcp {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
        }

        # Admin-only local .skill archive upload from Settings.
        location = /api/skills/install/upload {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            client_max_body_size 101M;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: Skills configuration endpoint
        location /api/skills {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: Agents endpoint
        location /api/agents {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
        }

        # Custom API: Uploads endpoint
        location ~ ^/api/threads/[^/]+/uploads {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            # Large file upload support
            client_max_body_size 100M;
            proxy_request_buffering off;

            # Disable response buffering to avoid permission errors
            proxy_buffering off;
            proxy_cache off;
        }

        # Real-time voice conversation is a WebSocket upgrade. Match it before
        # the generic /api/ catch-all so Upgrade/Connection reach FastAPI.
        location = /api/multimodal/voice {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Live browser stream is a WebSocket upgrade. It must be matched before
        # the generic /api/threads regex below (which omits Upgrade/Connection
        # forwarding and would downgrade it to plain HTTP).
        location ~ ^/api/threads/[^/]+/browser/stream {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Long-lived Live stream: keep the upgraded connection open.
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Custom API: Other endpoints under /api/threads
        location ~ ^/api/threads {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
        }

        # API Documentation: Swagger UI.
        # Path parity with docker/nginx/nginx.conf and the Helm ConfigMap: the
        # Gateway serves /docs and /redoc, and those two surfaces proxy them at
        # the Gateway's own path. This file used to expose them at /api/docs and
        # /api/redoc, so the URL that documented the API depended on the
        # deployment mode -- and `make dev` (local.conf) was the odd one out.
        location /docs {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
        }

        # API Documentation: ReDoc
        location /redoc {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
        }

        # API Documentation: OpenAPI Schema
        location /openapi.json {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
        }

        # Health check endpoint (gateway)
        location /health {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            proxy_buffering off;
            proxy_cache off;
        }

        # Alpha-to-Alpha Agent Cards and WebSocket transport must reach the
        # Gateway rather than the frontend/generic /api/ proxy.
        location = /.well-known/agent-card.json {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';
        }

        location = /.well-known/agent.json {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';
        }

        location = /api/peer-network/ws {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Catch-all for any /api/* prefix not matched by a more specific block above.
        # Covers the auth module (/api/v1/auth/login, /me, /change-password, ...),
        # plus feedback / runs / token-usage routes that 2.0-rc added without
        # updating this nginx config. Longest-prefix matching ensures the explicit
        # blocks above (/api/models, /api/threads regex, /api/langgraph/, ...) still
        # win for their paths — only truly unmatched /api/* requests land here.
        location /api/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Clear the hop-by-hop header so the `upstream gateway` keepalive pool is usable.
            proxy_set_header Connection '';

            # Auth endpoints set HttpOnly cookies — make sure nginx doesn't
            # strip the Set-Cookie header from upstream responses.
            proxy_pass_header Set-Cookie;

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
            proxy_buffering off;
            proxy_cache off;
        }

        # All other requests go to frontend
        location / {
            # The gateway's coded 502/504 bodies describe the *gateway*; the
            # frontend has no upstream to blame. Interception is off here so a
            # frontend failure keeps its own error page instead of claiming the
            # gateway went away.
            proxy_intercept_errors off;
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;

            # Disable response buffering for the frontend. Without this,
            # nginx tries to spool large upstream responses (e.g. Next.js
            # static chunks) into ``proxy_temp_path``, which defaults to
            # the system-owned ``/var/lib/nginx/proxy`` and fails with
            # ``[crit] open() ... failed (13: Permission denied)`` when
            # nginx is launched as a non-root user (every dev machine
            # except production root containers). The symptom on the
            # client side is ``ERR_INCOMPLETE_CHUNKED_ENCODING`` and
            # ``ChunkLoadError`` partway through page hydration.
            #
            # Streaming the response straight through avoids the
            # temp-file path entirely. The frontend already sets its
            # own cache headers, so we don't lose anything from
            # disabling nginx-side buffering.
            proxy_buffering off;
            proxy_request_buffering off;

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
