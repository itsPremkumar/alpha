<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting local services</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #0b0f14;
        color: #e6edf3;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        user-select: none;
      }
      .card {
        width: 360px;
        padding: 32px 28px;
        text-align: center;
      }
      .logo {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .logo span {
        color: #58a6ff;
      }
      .subtitle {
        font-size: 13px;
        color: #8b949e;
        margin-bottom: 26px;
      }
      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 3px solid #21262d;
        border-top-color: #58a6ff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 14px;
        min-height: 20px;
      }
      #detail {
        font-size: 12px;
        color: #8b949e;
        margin-top: 6px;
        min-height: 16px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">Agent <span>Workspace</span></div>
      <div class="subtitle">Starting local services…</div>
      <div class="spinner"></div>
      <div id="status">Initializing…</div>
      <div id="detail"></div>
    </div>
    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var detailEl = document.getElementById("detail");
        function render(payload) {
          if (!payload) return;
          if (payload.message) statusEl.textContent = payload.message;
          detailEl.textContent = payload.detail || "";
        }
        var api = window.agentWorkspace || window.alpha;
        if (api && api.onStatus) {
          api.onStatus(render);
          api.getStatus().then(render).catch(function () {});
        }
      })();
    </script>
  </body>
</html>
