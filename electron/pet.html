<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alpha Lion Companion</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        --mane-a: #fbbf24;
        --mane-b: #d97706;
        --mane-c: #92400e;
        --face-a: #fde68a;
        --face-b: #f59e0b;
        --body: #fbbf24;
        --ear: #f59e0b;
        --inner-ear: #fda4af;
        --ink: #431407;
        --muzzle: #fff7d6;
        --accent: #fef3c7;
        -webkit-app-region: drag;
        user-select: none;
      }

      body[data-skin="midnight"] {
        --mane-a: #818cf8; --mane-b: #4f46e5; --mane-c: #1e1b4b;
        --face-a: #c7d2fe; --face-b: #818cf8; --body: #6366f1;
        --ear: #6366f1; --inner-ear: #f0abfc; --ink: #111827;
        --muzzle: #e0e7ff; --accent: #c4b5fd;
      }

      body[data-skin="ember"] {
        --mane-a: #fb923c; --mane-b: #ea580c; --mane-c: #7c2d12;
        --face-a: #fed7aa; --face-b: #fb923c; --body: #f97316;
        --ear: #ea580c; --inner-ear: #fda4af; --ink: #431407;
        --muzzle: #ffedd5; --accent: #fed7aa;
      }

      body[data-skin="frost"] {
        --mane-a: #a5f3fc; --mane-b: #38bdf8; --mane-c: #0c4a6e;
        --face-a: #ecfeff; --face-b: #67e8f9; --body: #22d3ee;
        --ear: #0ea5e9; --inner-ear: #bae6fd; --ink: #164e63;
        --muzzle: #f0fdfa; --accent: #cffafe;
      }

      body[data-skin="royal"] {
        --mane-a: #c084fc; --mane-b: #7c3aed; --mane-c: #3b0764;
        --face-a: #f5d0fe; --face-b: #c084fc; --body: #8b5cf6;
        --ear: #7c3aed; --inner-ear: #f9a8d4; --ink: #2e1065;
        --muzzle: #faf5ff; --accent: #fde68a;
      }

      body[data-skin="moss"] {
        --mane-a: #bef264; --mane-b: #65a30d; --mane-c: #365314;
        --face-a: #ecfccb; --face-b: #bef264; --body: #84cc16;
        --ear: #65a30d; --inner-ear: #fda4af; --ink: #1a2e05;
        --muzzle: #f7fee7; --accent: #d9f99d;
      }

      #pet {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 3px 7px 8px;
      }

      #bubble {
        position: absolute;
        top: 4px;
        left: 8px;
        right: 8px;
        min-height: 42px;
        display: flex;
        align-items: flex-start;
        gap: 7px;
        border: 1px solid rgb(251 191 36 / 0.38);
        border-radius: 12px 12px 4px 12px;
        background: rgb(15 23 42 / 0.94);
        padding: 8px 10px;
        color: #fffbeb;
        font-size: 11px;
        line-height: 1.35;
        box-shadow: 0 12px 28px rgb(15 23 42 / 0.32);
      }

      #state-dot {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        width: 17px;
        height: 17px;
        border-radius: 999px;
        background: rgb(251 191 36 / 0.18);
        color: #fcd34d;
        font-size: 10px;
        font-weight: 800;
      }

      #message {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #art {
        position: absolute;
        left: 50%;
        bottom: 1px;
        width: 178px;
        height: 178px;
        transform: translateX(-50%);
        transform-origin: 50% 85%;
        filter: drop-shadow(0 16px 15px rgb(15 23 42 / 0.35));
        animation: breathe 4.8s ease-in-out infinite;
      }

      #art .shadow { fill: rgb(15 23 42 / 0.25); }
      #art .motion-lines,
      #art .sparkles,
      #art .roar-waves { display: none; }
      #art .motion-lines { stroke: var(--accent); }
      #art .sparkles { fill: var(--accent); }
      #art .roar-waves { fill: none; stroke: var(--accent); }
      #art .mane-main { fill: url(#mane); }
      #art .tail { stroke: var(--mane-b); }
      #art .tail-tuft { fill: var(--mane-c); }
      #art .body-main { fill: url(#chest); }
      #art .leg { transform-box: fill-box; transform-origin: 50% 0%; }
      #art .torso { stroke: rgb(120 53 15 / 0.2); stroke-width: 1.5; }
      #art .chest { filter: drop-shadow(0 2px 2px rgb(120 53 15 / 0.12)); }
      #art .upper-leg,
      #art .lower-leg { fill: none; stroke: var(--mane-b); stroke-linecap: round; stroke-linejoin: round; stroke-width: 8; }
      #art .lower-leg { stroke-width: 6; }
      #art .paw { fill: var(--body); stroke: rgb(120 53 15 / 0.32); stroke-width: 1.2; }
      #art .claws { fill: none; stroke: rgb(255 251 235 / 0.8); stroke-linecap: round; stroke-width: 1.4; }
      #art .body-paw { fill: var(--body); }
      #art .body-paw-light { fill: var(--muzzle); }
      #art .ear { fill: var(--ear); }
      #art .inner-ear { fill: var(--inner-ear); }
      #art .face-main { fill: url(#face); }
      #art .muzzle { fill: var(--muzzle); }
      #art .nose { fill: var(--ink); }
      #art .face-ink { fill: var(--ink); }
      #art .face-stroke { stroke: var(--ink); }
      #art .accent-stroke { stroke: var(--accent); }
      #art .stop-mane-a { stop-color: var(--mane-a); }
      #art .stop-mane-b { stop-color: var(--mane-b); }
      #art .stop-mane-c { stop-color: var(--mane-c); }
      #art .stop-face-a { stop-color: var(--face-a); }
      #art .stop-face-b { stop-color: var(--face-b); }
      #art .stop-chest-a { stop-color: var(--muzzle); }
      #art .stop-chest-b { stop-color: var(--body); }
      #art .state-mark { stroke: var(--accent); }

      body[data-action="walk"] #art .motion-lines,
      body[data-action="run"] #art .motion-lines,
      body[data-action="play"] #art .sparkles,
      body[data-action="roar"] #art .roar-waves { display: block; }

      #nameplate {
        position: absolute;
        left: 50%;
        bottom: -1px;
        transform: translateX(-50%);
        color: #fef3c7;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 3px rgb(0 0 0 / 0.7);
        white-space: nowrap;
      }

      #controls {
        position: absolute;
        top: 5px;
        right: 5px;
        z-index: 2;
        display: flex;
        gap: 4px;
        -webkit-app-region: no-drag;
      }

      #controls button {
        min-width: 22px;
        height: 22px;
        border: 1px solid rgb(253 230 138 / 0.3);
        border-radius: 999px;
        background: rgb(15 23 42 / 0.8);
        color: #fde68a;
        cursor: pointer;
        font-size: 9px;
        font-weight: 700;
        line-height: 18px;
        padding: 0 6px;
      }

      #controls button:hover { background: rgb(180 83 9 / 0.9); color: white; }
      #return { font-size: 13px !important; padding: 0 !important; }

      body[data-state="thinking"] #art { animation: think 1.25s ease-in-out infinite; }
      body[data-state="working"] #art { animation: work 0.8s ease-in-out infinite; }
      body[data-state="waiting"] #art { animation: alert 1.4s ease-in-out infinite; }
      body[data-state="success"] #art { animation: celebrate 0.9s ease-in-out 2; }
      body[data-state="error"] #art { animation: error 1.8s ease-in-out infinite; }
      body[data-state="sleeping"] #art { animation: sleep 5s ease-in-out infinite; filter: saturate(0.72) brightness(0.86); }
      body[data-action="walk"] #art { animation: walk 0.68s ease-in-out infinite; }
      body[data-action="run"] #art { animation: run 0.38s ease-in-out infinite; }
      body[data-action="jump"] #art { animation: jump 0.9s cubic-bezier(0.22, 0.8, 0.3, 1) 1; }
      body[data-action="roar"] #art { animation: roar 0.72s ease-in-out 2; }
      body[data-action="pounce"] #art { animation: pounce 1.1s cubic-bezier(0.2, 0.8, 0.25, 1) 1; }
      body[data-action="play"] #art { animation: play 1.25s ease-in-out infinite; }
      body[data-action="sleep"] #art { animation: action-sleep 5s ease-in-out infinite; filter: saturate(0.72) brightness(0.86); }
      body[data-action="stretch"] #art { animation: stretch 1.6s ease-in-out 1; }
      body[data-action="prowl"] #art { animation: prowl 1.8s ease-in-out infinite; }
      body[data-action="hunt"] #art { animation: hunt 1.6s ease-in-out infinite; }
      body[data-action="shake"] #art { animation: shake 0.24s ease-in-out 5; }
      body[data-action="spin"] #art { animation: spin 1.5s cubic-bezier(0.3, 0.8, 0.3, 1) 1; }
      body[data-action="walk"] #art .tail,
      body[data-action="run"] #art .tail { animation: tail-wag 0.42s ease-in-out infinite alternate; }
      body[data-action="walk"] #art .leg-front-left,
      body[data-action="walk"] #art .leg-rear-right { animation: leg-step-a 0.68s ease-in-out infinite alternate; }
      body[data-action="walk"] #art .leg-front-right,
      body[data-action="walk"] #art .leg-rear-left { animation: leg-step-b 0.68s ease-in-out infinite alternate; }
      body[data-action="run"] #art .leg-front-left,
      body[data-action="run"] #art .leg-rear-right { animation: leg-run-a 0.38s ease-in-out infinite alternate; }
      body[data-action="run"] #art .leg-front-right,
      body[data-action="run"] #art .leg-rear-left { animation: leg-run-b 0.38s ease-in-out infinite alternate; }
      body[data-action="prowl"] #art .leg-front-left,
      body[data-action="prowl"] #art .leg-rear-right { animation: leg-prowl-a 1.8s ease-in-out infinite alternate; }
      body[data-action="prowl"] #art .leg-front-right,
      body[data-action="prowl"] #art .leg-rear-left { animation: leg-prowl-b 1.8s ease-in-out infinite alternate; }
      body[data-action="hunt"] #art .leg-front-left { animation: leg-hunt 1.6s ease-in-out infinite; }
      body[data-action="hunt"] #art .leg:not(.leg-front-left) { animation: leg-hunt-idle 1.6s ease-in-out infinite; }
      body[data-action="jump"] #art .leg,
      body[data-action="pounce"] #art .leg { animation: leg-tuck 0.9s ease-in-out 1; }
      body[data-action="sleep"] #art .leg { animation: leg-sleep 5s ease-in-out infinite; }
      body[data-action="stretch"] #art .leg { animation: leg-stretch 1.6s ease-in-out 1; }
      body[data-action="shake"] #art .head { animation: head-shake 0.24s ease-in-out 5; }
      body[data-action="walk"] #art .body,
      body[data-action="run"] #art .body { animation: body-step 0.38s ease-in-out infinite alternate; }
      body[data-action="run"] #art .head { animation: head-run 0.38s ease-in-out infinite alternate; }
      body[data-action="jump"] #art .shadow,
      body[data-action="pounce"] #art .shadow { animation: shadow-jump 0.9s ease-in-out 1; }
      .motion-lines, .sparkles, .roar-waves { transform-origin: center; animation: decoration-pulse 0.8s ease-in-out infinite alternate; }

      @keyframes prowl {
        0%, 100% { transform: translateX(-50%) translateY(2px) rotate(-1deg) scaleY(0.96); }
        50% { transform: translateX(calc(-50% + 5px)) translateY(4px) rotate(1deg) scaleY(0.94); }
      }
      @keyframes hunt {
        0%, 100% { transform: translateX(-50%) translateY(4px) rotate(-2deg) scale(1.02, 0.9); }
        50% { transform: translateX(calc(-50% + 3px)) translateY(1px) rotate(2deg) scale(1.04, 0.88); }
      }
      @keyframes shake {
        0%, 100% { transform: rotate(0); }
        25% { transform: rotate(-2deg) translateX(-2px); }
        75% { transform: rotate(2deg) translateX(2px); }
      }
      @keyframes spin {
        0% { transform: rotate(0) scale(0.92); }
        50% { transform: rotate(180deg) translateY(-8px) scale(1.08); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes leg-step-a {
        0% { transform: rotate(0deg) translateY(0); }
        50% { transform: rotate(-8deg) translateY(-4px); }
        100% { transform: rotate(5deg) translateY(0); }
      }
      @keyframes leg-step-b {
        0% { transform: rotate(0deg) translateY(0); }
        50% { transform: rotate(8deg) translateY(-4px); }
        100% { transform: rotate(-5deg) translateY(0); }
      }
      @keyframes leg-run-a {
        0% { transform: rotate(-3deg) translateY(0); }
        50% { transform: rotate(-18deg) translateY(-8px); }
        100% { transform: rotate(10deg) translateY(0); }
      }
      @keyframes leg-run-b {
        0% { transform: rotate(3deg) translateY(0); }
        50% { transform: rotate(18deg) translateY(-8px); }
        100% { transform: rotate(-10deg) translateY(0); }
      }
      @keyframes leg-prowl-a {
        0% { transform: rotate(0) translateY(0); }
        50% { transform: rotate(-5deg) translateY(-2px); }
        100% { transform: rotate(3deg) translateY(0); }
      }
      @keyframes leg-prowl-b {
        0% { transform: rotate(0) translateY(0); }
        50% { transform: rotate(5deg) translateY(-2px); }
        100% { transform: rotate(-3deg) translateY(0); }
      }
      @keyframes leg-hunt {
        0%, 100% { transform: rotate(0) translateY(0); }
        35% { transform: rotate(-15deg) translateY(-10px); }
        70% { transform: rotate(5deg) translateY(0); }
      }
      @keyframes leg-hunt-idle {
        0%, 100% { transform: rotate(0) translateY(1px); }
        50% { transform: rotate(2deg) translateY(0); }
      }
      @keyframes leg-tuck {
        0%, 100% { transform: rotate(0) translateY(0); }
        40% { transform: rotate(16deg) translateY(-9px) scaleY(0.85); }
        75% { transform: rotate(-8deg) translateY(2px) scaleY(1.05); }
      }
      @keyframes leg-sleep {
        0%, 100% { transform: rotate(0) translateY(2px) scaleY(0.92); }
        50% { transform: rotate(2deg) translateY(4px) scaleY(0.9); }
      }
      @keyframes leg-stretch {
        0%, 100% { transform: rotate(0) translateY(0); }
        45% { transform: rotate(-8deg) translateY(-4px) scaleY(1.08); }
      }
      @keyframes head-shake {
        0%, 100% { transform: rotate(0) translateX(0); }
        25% { transform: rotate(-3deg) translateX(-2px); }
        75% { transform: rotate(3deg) translateX(2px); }
      }
      @keyframes walk {
        0%, 100% { transform: translateX(-50%) rotate(-1deg) translateY(0); }
        50% { transform: translateX(calc(-50% + 3px)) rotate(1deg) translateY(-2px); }
      }
      @keyframes run {
        0%, 100% { transform: translateX(-50%) rotate(-3deg) translateY(0); }
        50% { transform: translateX(calc(-50% + 7px)) rotate(3deg) translateY(-4px); }
      }
      @keyframes jump {
        0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
        18% { transform: translateX(-50%) translateY(4px) scale(0.96, 0.9); }
        52% { transform: translateX(-50%) translateY(-34px) scale(0.96, 1.06); }
        78% { transform: translateX(-50%) translateY(2px) scale(1.04, 0.94); }
      }
      @keyframes roar {
        0%, 100% { transform: translateX(-50%) translateY(0) rotate(0); }
        35% { transform: translateX(-50%) translateY(-7px) rotate(-2deg) scale(1.04); }
        70% { transform: translateX(-50%) translateY(-2px) rotate(2deg) scale(1.02); }
      }
      @keyframes pounce {
        0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
        22% { transform: translateX(-50%) translateY(5px) scale(1.08, 0.88); }
        58% { transform: translateX(-50%) translateY(-25px) scale(0.9, 1.12) rotate(-4deg); }
        82% { transform: translateX(-50%) translateY(2px) scale(1.06, 0.92) rotate(2deg); }
      }
      @keyframes play {
        0%, 100% { transform: translateX(-50%) translateY(0) rotate(-2deg); }
        25% { transform: translateX(-50%) translateY(-8px) rotate(3deg); }
        50% { transform: translateX(-50%) translateY(0) rotate(-3deg); }
        75% { transform: translateX(-50%) translateY(-5px) rotate(2deg); }
      }
      @keyframes action-sleep {
        0%, 100% { transform: translateX(-50%) translateY(2px) scale(0.98); }
        50% { transform: translateX(-50%) translateY(5px) scale(0.96); }
      }
      @keyframes stretch {
        0%, 100% { transform: translateX(-50%) scale(1, 1); }
        35% { transform: translateX(-50%) scale(0.9, 1.12) translateY(-3px); }
        70% { transform: translateX(-50%) scale(1.08, 0.94) translateY(2px); }
      }
      @keyframes tail-wag {
        0% { transform: rotate(-3deg); }
        100% { transform: rotate(5deg); }
      }
      @keyframes body-step {
        0% { transform: translateY(0) rotate(-1deg); }
        100% { transform: translateY(-3px) rotate(1deg); }
      }
      @keyframes head-run {
        0% { transform: rotate(-2deg) translateY(0); }
        100% { transform: rotate(2deg) translateY(-3px); }
      }
      @keyframes shadow-jump {
        0%, 100% { transform: scaleX(1); opacity: 0.8; }
        18% { transform: scaleX(0.8); opacity: 0.55; }
        52% { transform: scaleX(0.55); opacity: 0.3; }
        78% { transform: scaleX(1.08); opacity: 0.75; }
      }
      @keyframes decoration-pulse {
        0% { opacity: 0.35; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1.05); }
      }

      @keyframes breathe {
        0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
        50% { transform: translateX(-50%) translateY(-2px) scale(1.012); }
      }
      @keyframes think {
        0%, 100% { transform: translateX(-50%) rotate(-1deg) translateY(0); }
        50% { transform: translateX(-50%) rotate(1deg) translateY(-4px); }
      }
      @keyframes work {
        0%, 100% { transform: translateX(-50%) translateX(0) rotate(0); }
        25% { transform: translateX(calc(-50% - 2px)) rotate(-1deg); }
        75% { transform: translateX(calc(-50% + 2px)) rotate(1deg); }
      }
      @keyframes alert {
        0%, 100% { transform: translateX(-50%) translateY(0) rotate(0); }
        50% { transform: translateX(-50%) translateY(-5px) rotate(-2deg); }
      }
      @keyframes celebrate {
        0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
        35% { transform: translateX(-50%) translateY(-10px) scale(1.06) rotate(-2deg); }
        70% { transform: translateX(-50%) translateY(-3px) scale(1.02) rotate(2deg); }
      }
      @keyframes error {
        0%, 100% { transform: translateX(-50%) translateX(0); }
        25% { transform: translateX(calc(-50% - 2px)) rotate(-1deg); }
        75% { transform: translateX(calc(-50% + 2px)) rotate(1deg); }
      }
      @keyframes sleep {
        0%, 100% { transform: translateX(-50%) translateY(2px) scale(0.98); }
        50% { transform: translateX(-50%) translateY(5px) scale(0.96); }
      }

      @media (prefers-reduced-motion: reduce) {
        #art,
        #art .tail,
        #art .body,
        #art .head,
        #art .leg,
        #art .motion-lines,
        #art .sparkles,
        #art .roar-waves { animation: none; }
      }
    </style>
  </head>
  <body data-state="idle" data-action="idle" data-skin="golden">
    <main id="pet" aria-label="Alpha lion companion">
      <div id="bubble" role="status" aria-live="polite">
        <span id="state-dot" aria-hidden="true">✦</span>
        <span id="message">The desk is quiet. I'm here when you need me.</span>
      </div>
      <div id="controls">
        <button id="walk" type="button" aria-label="Make Milo walk">Walk</button>
        <button id="run" type="button" aria-label="Make Milo run">Run</button>
        <button id="perform" type="button" aria-label="Make Milo perform an action">Action</button>
        <button id="skin" type="button" aria-label="Change Milo's lion look">Look</button>
        <button id="return" type="button" aria-label="Return lion to Alpha">×</button>
      </div>
      <svg id="art" viewBox="0 0 220 210" role="img" aria-label="Milo the lion companion">
        <defs>
          <linearGradient id="mane" x1="0" y1="0" x2="1" y2="1">
            <stop class="stop-mane-a" offset="0" stop-color="#fbbf24" />
            <stop class="stop-mane-b" offset="0.55" stop-color="#d97706" />
            <stop class="stop-mane-c" offset="1" stop-color="#92400e" />
          </linearGradient>
          <linearGradient id="face" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop class="stop-face-a" offset="0" stop-color="#fde68a" />
            <stop class="stop-face-b" offset="1" stop-color="#f59e0b" />
          </linearGradient>
          <radialGradient id="chest" cx="50%" cy="35%" r="70%">
            <stop class="stop-chest-a" offset="0" stop-color="#fff7d6" />
            <stop class="stop-chest-b" offset="1" stop-color="#fbbf24" />
          </radialGradient>
        </defs>
        <ellipse class="shadow" cx="111" cy="194" rx="67" ry="10" fill="rgb(15 23 42 / 0.25)" />
        <g class="motion-lines" fill="none" stroke="#fef3c7" stroke-linecap="round" stroke-width="3">
          <path d="M28 105h22M18 116h28M32 127h18" />
        </g>
        <g class="sparkles" fill="#fef3c7">
          <text x="34" y="72" font-size="18">✦</text>
          <text x="177" y="92" font-size="14">✧</text>
        </g>
        <g class="roar-waves" fill="none" stroke="#fef3c7" stroke-linecap="round" stroke-width="3">
          <path d="M168 67c12 7 12 21 0 28M178 57c21 13 21 35 0 48" />
        </g>
        <path class="tail" d="M153 161c35 3 40-25 24-37-11-8-27 0-22 13 3 8 13 7 17 2" fill="none" stroke="#d97706" stroke-linecap="round" stroke-width="10" />
        <path class="tail-tuft" d="M175 119c-5-9 1-18 10-17 8 1 10 10 4 15-4 4-9 5-14 2Z" fill="#92400e" />
        <g class="leg leg-rear-left">

          <circle cx="91" cy="101" r="1" fill="var(--ink)" stroke="none" /><circle cx="96" cy="104" r="1" fill="var(--ink)" stroke="none" />
          <circle cx="129" cy="101" r="1" fill="var(--ink)" stroke="none" /><circle cx="124" cy="104" r="1" fill="var(--ink)" stroke="none" />
        </g>
        <path class="state-mark" d="" fill="none" stroke="#fef3c7" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />

      <div id="nameplate">Milo · <span id="status">Ready</span></div>
    </main>
    <script>
      (() => {
        const allowed = new Set(["idle", "thinking", "working", "waiting", "success", "error", "sleeping"]);
        const allowedActions = new Set(["idle", "walk", "run", "jump", "roar", "pounce", "play", "sleep", "stretch", "prowl", "hunt", "shake", "spin"]);
        const allowedSkins = new Set(["golden", "midnight", "ember", "frost", "royal", "moss"]);
        const labels = {
          idle: ["Ready", "✦"],
          thinking: ["Thinking", "？"],
          working: ["Working", "⚡"],
          waiting: ["Needs you", "!"],
          success: ["Complete", "✓"],
          error: ["Needs attention", "!"],
          sleeping: ["Resting", "z"],
        };
        const actionLabels = {
          idle: ["Ready", "✦"],
          walk: ["Walking", "↔"],
          run: ["Running", "»"],
          jump: ["Jumping", "↑"],
          roar: ["Roaring", " roar "],
          pounce: ["Pouncing", "◆"],
          play: ["Playing", "✧"],
          sleep: ["Sleeping", "z"],
          stretch: ["Stretching", "—"],
          prowl: ["Prowling", "⌁"],
          hunt: ["Hunting pose", "⌕"],
          shake: ["Shaking off", "≈"],
          spin: ["Spinning", "↻"],
        };
        const defaults = {
          idle: "The desk is quiet. I'm here when you need me.",
          thinking: "Paw-sing the problem...",
          working: "I'm on it. Roaring quietly.",
          waiting: "I found a decision point for you.",
          success: "Task complete. Nice work, team.",
          error: "That path hit a snag. We can retry safely.",
          sleeping: "Resting my paws for a moment.",
        };
        const body = document.body;
        const message = document.getElementById("message");
        const status = document.getElementById("status");
        const dot = document.getElementById("state-dot");
        const details = document.querySelector(".face-details");
        const mark = document.querySelector(".state-mark");
        const bridge = window.alphaPet;
        const actionCycle = ["walk", "run", "jump", "roar", "pounce", "play", "sleep", "stretch", "prowl", "hunt", "shake", "spin"];
        const skinCycle = ["golden", "midnight", "ember", "frost", "royal", "moss"];
        let currentPayload = { state: "idle", action: "idle", skin: "golden", message: "The desk is quiet. I'm here when you need me." };
        const closedEyes = '<path d="M82 77c6 5 12 5 18 0M120 77c6 5 12 5 18 0" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="3" />';
        const openEyes = '<ellipse cx="91" cy="77" rx="7" ry="8" fill="var(--muzzle)" /><ellipse cx="129" cy="77" rx="7" ry="8" fill="var(--muzzle)" /><circle class="face-ink" cx="91" cy="78" r="3.5" fill="var(--ink)" /><circle class="face-ink" cx="129" cy="78" r="3.5" fill="var(--ink)" /><circle cx="93" cy="76" r="1.3" fill="white" /><circle cx="131" cy="76" r="1.3" fill="white" />';
        const faceDetails = openEyes + '<path class="face-stroke" d="M80 65l15 3M125 68l15-3" fill="none" stroke="var(--mane-c)" stroke-linecap="round" stroke-width="3" /><path class="face-stroke" d="M100 108c4 10 16 10 20 0" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="3" />';

        function text(value, fallback, limit) {
          if (typeof value !== "string") return fallback;
          const clean = value.replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim();
          return clean ? clean.slice(0, limit) : fallback;
        }

        function apply(payload) {
          const state = allowed.has(payload?.state) ? payload.state : "idle";
          const action = allowedActions.has(payload?.action) ? payload.action : "idle";
          const skin = allowedSkins.has(payload?.skin) ? payload.skin : "golden";
          const [label, symbol] = action === "idle" ? labels[state] : actionLabels[action];
          body.dataset.state = state;
          body.dataset.action = action;
          body.dataset.skin = skin;
          status.textContent = label;
          dot.textContent = symbol;
          message.textContent = text(payload?.message, defaults[state], 160);
          if (action === "sleep" || state === "sleeping") {
            details.innerHTML = closedEyes;
          } else if (action === "roar") {
            details.innerHTML = openEyes + '<ellipse class="face-ink" cx="110" cy="111" rx="13" ry="10" fill="var(--ink)" /><path d="M101 106l3 5 3-5 3 5 3-5 3 5" fill="var(--muzzle)" opacity=".92" /><ellipse cx="110" cy="116" rx="6" ry="3" fill="#fb7185" />';
          } else if (action === "jump" || action === "run" || action === "pounce") {
            details.innerHTML = openEyes;
          } else if (state === "success") {
            details.innerHTML = closedEyes;
          } else {
            details.innerHTML = faceDetails;
          }
          if (action === "roar") mark.setAttribute("d", "M151 39l5 6 11-13");
          else if (action === "play") mark.setAttribute("d", "M151 39l5 6 11-13M146 51l5 5 10-11");
          else if (action === "sleep") mark.setAttribute("d", "M154 30h12M154 38h9");
          else if (state === "error") mark.setAttribute("d", "M101 111c5-5 13-5 18 0");
          else if (state === "waiting") mark.setAttribute("d", "M101 111c5 4 13 4 18 0");
          else if (state === "thinking") mark.setAttribute("d", "M143 46c8-8 16-8 23-2");
          else if (state === "success") mark.setAttribute("d", "M151 39l5 6 11-13");
          else if (state === "working") mark.setAttribute("d", "M156 47l8-5-8-5M164 52l8-5-8-5");
          else if (state === "sleeping") mark.setAttribute("d", "M154 30h12M154 38h9");
          else mark.setAttribute("d", "");
          currentPayload = { state, action, skin, message: message.textContent };
        }

        bridge?.onState?.(apply);
        function requestAction(action) {
          void Promise.resolve(bridge?.performAction?.(action)).catch(() => {});
          apply({ action, message: `Milo is ${actionLabels[action][0].toLowerCase()}.` });
        }
        document.getElementById("walk").addEventListener("click", () => requestAction("walk"));
        document.getElementById("run").addEventListener("click", () => requestAction("run"));
        document.getElementById("perform").addEventListener("click", () => {
          const currentIndex = Math.max(0, actionCycle.indexOf(currentPayload.action));
          const nextAction = actionCycle[(currentIndex + 1) % actionCycle.length];
          requestAction(nextAction);
        });
        document.getElementById("skin").addEventListener("click", () => {
          const currentIndex = Math.max(0, skinCycle.indexOf(currentPayload.skin));
          const nextSkin = skinCycle[(currentIndex + 1) % skinCycle.length];
          apply({ skin: nextSkin });
        });
        document.getElementById("return").addEventListener("click", () => bridge?.close?.());
        apply({ state: "idle", action: "idle", skin: "golden", message: "The desk is quiet. I'm here when you need me." });
      })();
    </script>
