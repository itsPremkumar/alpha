apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-workspace.fullname" . }}-extensions
  namespace: {{ include "agent-workspace.namespace" . }}
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
data:
  extensions_config.json: |
{{ .Values.extensionsConfig | default "" | indent 4 }}
