# Fallback per-model prices, per 1M tokens. Consulted only for a model that
# omits an inline `models[].pricing`; an inline block always wins. This table is
# keyed by bare model name and carries no currency, so it uses `input`/`output`
# (NOT the `*_per_million` keys an inline block uses - different scope, not a
# typo) and adopts whatever currency the priced models established, USD if
# none. `input`/`output` are both required and an unknown key is a load error.
model_pricing:
  claude-3-7-sonnet:
    input: 3.0
    output: 15.0
  claude-3-5-sonnet:
    input: 3.0
    output: 15.0
  o3-mini:
    input: 1.1
    output: 4.4
  gpt-4o:
    input: 2.5
    output: 10.0
  gpt-4o-mini:
    input: 0.15
    output: 0.6
  gemini-2.0-flash:
    input: 0.1
    output: 0.4
  deepseek-coder:
    input: 0.13999999999999999
    output: 0.27999999999999997
  default:
    input: 1.0
    output: 3.0
