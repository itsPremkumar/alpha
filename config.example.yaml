# Configuration for the Alpha application
#
# This is the ONLY configuration file you need. It carries every AI/LLM model
# setting too: `models[]`, `providers:`, `model_routing`, `default_model`, and
# the `model_catalog:` / `free_gateways:` / `model_pricing:` sections that used
# to live in a separate models.yaml. That second file is gone - its loader,
# template and generator were removed with it, because no first-run step created
# it reliably and a fresh install was left with an empty keyless-gateway list.
#
# Guidelines:
# - Copy this file to `config.yaml` and customize it for your environment
# - The default path of this configuration file is `config.yaml` in the project root.
#   You can set `ALPHA_PROJECT_ROOT` to define that root explicitly, or use
#   `ALPHA_CONFIG_PATH` to point at a specific config file.
# - Runtime state defaults to `.alpha` under the project root. Override it
#   with `ALPHA_HOME` when you need a different writable data directory.
# - Set `ALPHA_DATE_TIMEZONE` to an IANA timezone name (e.g. `Asia/Shanghai`)
#   when the conversation date injected into agents should follow a zone other
#   than the server's local timezone. It is read at runtime by the date-context
#   middlewares (not a config-schema field), so it can be set on a container
#   without mounting a `config.yaml`.
# - Environment variables are available for all field values. Example: `api_key: $OPENAI_API_KEY`
# - The `use` path is a string that looks like "package_name.sub_package_name.module_name:class_name/variable_name".

# ============================================================================
# Config Version (used to detect outdated config files)
# ============================================================================
# Bump this number when the config schema changes.
# Run `make config-upgrade` to merge new fields into your local config.yaml.
# 57: documented `network` (internet connectivity monitoring). Existing installs
# get the same values they already run with — the section's defaults were
# production-usable — so this is a documentation bump, not a behaviour change.
config_version: 59

# ============================================================================
# Logging
# ============================================================================
# Log level for alpha modules (debug/info/warning/error)
log_level: info

# Trace ids are always issued and always returned in the `X-Trace-Id` response
# header; this block controls log output only — whether records carry a
# `trace_id` field, and in which format. Off by default because enabling it
# changes the log format. Restart required (see reload_boundary.py).
logging:
  enhance:
    enabled: false
    format: text

# ============================================================================
# Agent Extensions
# ============================================================================
# Optional AgentMiddleware classes loaded into the lead and subagent runtime
# middleware chains after built-in runtime middlewares, but before the
# safety/clarification tail. Missing packages, invalid classes, and broken
# modules fail at agent creation with an actionable import error; constructor
# errors fail at agent creation with the underlying exception.
# The same list applies to both lead and subagent runtimes; lead-only vs
# subagent-only configuration is not expressible yet. Each entry is a class
# path or `{class, kwargs}` for constructor arguments. kwargs values must be
# JSON types (object, array, string, number, boolean, or null); YAML dates
# and timestamps are coerced to ISO strings so they match JSON. Treat these
# files as trusted operator config because middleware classes execute code.
# Uncomment this block to define middlewares in config.yaml. Leaving it commented
# lets extensions_config.json remain the source of truth for this fixed-slot
# (not deprecated) middleware list. Packaged plugins use the `plugins:` block below.
# extensions:
#   middlewares:
#     - my_company.alpha_middlewares:DomainGuardMiddleware
#     - class: my_company.alpha_middlewares:LatencyStampingMiddleware
#       kwargs:
#         header: X-Alpha-Latency

# ============================================================================
# Tracing / Observability (Monocle)
# ============================================================================
# Optional agent tracing via Monocle. Configured through environment variables
# (MONOCLE_TRACING, MONOCLE_EXPORTERS, OKAHU_API_KEY — like LangSmith/Langfuse),
# not config.yaml keys, and OFF by default. See README.md → "Monocle Tracing"
# for setup, what each exporter captures, and where the trace data goes.

# ============================================================================
# Token Usage
# ============================================================================
# Enable token usage collection and display.
# When enabled, Alpha records input/output/total tokens per model call
# and shows usage metadata in the workspace UI when providers return it.
token_usage:
  enabled: true

# ============================================================================
# Token Budget — Per-run token limits
# ============================================================================
# Prevents runaway API costs by enforcing hard token limits per run.
# When warn_threshold is crossed, the agent receives an in-context warning.
# When hard_stop_threshold is crossed, tool_calls are stripped and the agent
# is forced to produce a final answer immediately.
token_budget:
  enabled: false                # Set to true to activate budget enforcement
  max_tokens: 200000            # Total token limit (input + output) per run
  max_input_tokens: null        # Optional separate input-only limit
  max_output_tokens: null       # Optional separate output-only limit
  warn_threshold: 0.8           # Warn at 80% of the budget
  hard_stop_threshold: 1.0      # Force stop at 100% of the budget

# ============================================================================
# Recursion Limit — Hard ceiling for a client-supplied run recursion_limit
# ============================================================================
# A run's recursion_limit caps the number of LangGraph super-steps (each is at
# least one LLM call). The Gateway never trusts a client-supplied value
# verbatim: any value above this ceiling is clamped down to it, preventing
# runaway API cost / DoS. Invalid or non-positive client values fall back to
# the server default of 1000 (the Web UI's interactive budget, which matches
# this ceiling and the scheduler's default). Raise this only if you legitimately
# run very deeply nested subagent graphs.
max_recursion_limit: 1000

# ============================================================================
# Internet Connectivity Monitoring
# ============================================================================
# Alpha measures its own internet link and uses it to decide whether work may
# proceed: a run that dies from a confirmed outage is *parked*, not failed, and
# resumes by itself when the link returns. The reading is visible in the workspace
# header (state + measured round-trip), and the header's Retry button forces one
# immediate measurement through `POST /api/ops/network/recheck`.
#
# What is measured: a bounded TCP connect to each target. No HTTP request, no TLS
# handshake, no payload, and nothing derived from your data — a probe runs on a
# timer for the life of the process, so it must not send anything identifying you
# to a third party. The figure shown in the header is therefore the *route*, not
# any provider's health.
#
# While the link is down the poll loop keeps re-probing forever; it only slows
# down, from `backoff_initial_seconds` toward `backoff_max_seconds` (with jitter
# that only ever *reduces* a delay, so the ceiling stays real). There is no
# attempt limit on purpose — a probe loop that gave up would turn a ten-minute
# outage into permanent silence.
#
# Two states are deliberately not the same thing:
#   * `degraded` — some endpoints answered, some did not. NOT an outage; a
#     network operation is still attempted and nothing is parked.
#   * `unknown`  — the probe could not run. NOT offline. A broken probe is not a
#     dead link, so a network operation is still attempted. Announcing an outage
#     on a misconfigured probe would park every session on a lie.
#
# Restart required (see reload_boundary.py): the monitor, its backoff ladder and
# its target set are captured once at Gateway startup.
network:
  enabled: true
  # How often to probe while the link is healthy.
  poll_interval_seconds: 15.0
  # Consecutive agreeing probes required before publishing OFFLINE, and before
  # publishing ONLINE again. These stop a *flapping* link from parking and
  # un-parking your work; the exception is the very first probe after a cold
  # start, which publishes at once so a Gateway booting offline reports `offline`
  # now rather than `unknown` one poll later.
  offline_after_consecutive: 2
  online_after_consecutive: 2
  # Consecutive probe executions that fail before a healthy link is downgraded to
  # `unknown`. Raising it tolerates longer probe trouble.
  unknown_after_consecutive: 3
  # The offline ladder. Lower `backoff_max_seconds` to notice a recovery faster at
  # the cost of more (harmless, TCP-only) probes; raise `backoff_initial_seconds`
  # to be gentler on a link that is down for a long time.
  backoff_initial_seconds: 5.0
  backoff_max_seconds: 300.0
  backoff_multiplier: 2.0
  # Fraction by which each delay may be randomly reduced, so a fleet of hosts that
  # lost the link together does not retry in lockstep.
  backoff_jitter_ratio: 0.25
  # In-memory observation history retained per monitor, for operators.
  max_observations: 50
  # Reachability endpoints. Omit this to use the built-in two public resolvers on
  # provider-grade ports — which is what makes a single provider being down show
  # as `degraded` rather than a false `offline`. An EMPTY LIST IS REFUSED: it
  # would leave connectivity permanently `unknown`.
  # targets:
  #   - name: corp
  #     host: proxy.corp.test
  #     port: 8443
  #     timeout_seconds: 2.0


# ============================================================================
# Models Configuration
# ============================================================================
# Configure available LLM models for the agent to use.
#
# Two token fields look similar but mean different things:
# - `max_tokens` is the per-call OUTPUT cap passed to the provider.
# - `context_window` is a positive integer for the total context capacity
#   (prompt + completion). It drives the real-time "% context used" indicator
#   in the chat UI and feeds the model's langchain profile, which fraction-based
#   summarization triggers (`summarization.trigger: [{type: fraction, ...}]`)
#   resolve their thresholds from. Third-party OpenAI-compatible models carry no
#   built-in profile, so without `context_window` a fraction trigger degrades
#   (dropped with a warning) instead of crashing the agent build.
# Leave `context_window` unset if the provider limit is unknown; the percentage
# will not render. Verify configured values against the provider's model docs.
#
# Optional per-model pricing (powers the real-cost display on the workspace
# console). Add a `pricing` block to any model entry; use ONE currency across
# all models. Mixed currencies disable cost reporting to prevent invalid sums.
# Prices are per one million tokens.
#
# This is a schema, not a free-form annotation: the keys below are the ONLY
# ones accepted, and a typo fails at config load naming the model and the key.
# Before it was declared, `pricing: {inpt_per_million: 1.0}` loaded cleanly and
# simply reported no cost for anything - a configured price that silently did
# nothing. Genuine provider kwargs (api_key, base_url, max_tokens, ...) written
# as siblings of `pricing` are unaffected and still pass through untouched.
#
#   pricing:
#     currency: CNY                    # ISO code shown in the console (CNY, USD, ...); defaults to USD
#     input_per_million: 8.0           # price per 1M input tokens (cache miss)
#     output_per_million: 32.0         # price per 1M output tokens
#     input_cache_hit_per_million: 0.8 # price per 1M cache-hit input tokens
#                                      # (optional; omit → hits billed at miss price)
#
# The `model_pricing:` fallback table further down is a different key set on
# purpose: it is keyed by bare model name and carries no currency, so it uses
# `input`/`output`. That is a scope difference, not a typo - do not copy one
# shape into the other.
#
# Provider profiles (optional): named connection defaults shared by model
# entries. A model sets `provider:` to inherit every key it does not define
# itself (class path, endpoint, keys, timeouts, retries); model-level keys
# always win, and `name` is never inherited.
#
# providers:
#   doubao-shared:
#     use: alpha.models.patched_deepseek:PatchedChatDeepSeek
#     api_base: https://ark.cn-beijing.volces.com/api/v3
#     api_key: $VOLCENGINE_API_KEY
#     timeout: 600.0
#     max_retries: 2
#
# Fallback chains (optional): when a model fails with a retryable error
# (rate limit 429, server 5xx, timeout/connection failure), the call fails
# over to the next listed model entry. Deterministic failures (400/401/404,
# bad request, content blocks) raise immediately without failover. Chains
# resolve transitively, cap at 5 entries, and must be acyclic.
#
#   - name: doubao-seed-1.8
#     provider: doubao-shared           # inherits use/api_base/api_key above
#     model: doubao-seed-1-8-251228
#     fallbacks: [doubao-seed-1.8-lite] # other models[] names, in priority order
#     context_window: 262144
#
# ---------------------------------------------------------------------------
# Model catalog: everything is in THIS file
# ---------------------------------------------------------------------------
# Every model name Alpha knows about is configured here - there is no second
# model file. The relevant keys:
#
#   models[]        runtime-buildable models (declared above)
#   providers:      named connection profiles (declared above)
#   default_model   the model a run uses when nothing selects one
#   model_routing:  intent category / cost tier -> ordered model names
#   model_catalog:  bring-your-own-provider offers shown in Settings
#   free_gateways:  keyless public gateways the free router may use
#   model_pricing:  fallback per-model prices, per 1M tokens
#
# The last three are declared at the end of this file. Every name declared under
# `model_routing:` is validated against `models[]` at load: an unresolvable chain
# is a startup error, not a silent fallback to the default model.
#
# A separate `models.yaml` used to hold these. It is GONE - its loader, template
# and generator were removed, because no first-run step created it reliably and a
# fresh install was therefore left with an empty keyless-gateway list while the
# picker still advertised `alpha-free`. A duplicate id below is a config error,
# not something to reconcile.
#
# Model lists also refresh themselves from the provider: `GET /api/models/discovery`
# returns each provider's live catalog (OpenRouter rotates its :free set daily),
# normalized with the model's context window kept separate from the endpoint's.
# `POST /api/models/discovery/refresh` forces a refetch.
# ---------------------------------------------------------------------------

# The model a run uses when the request, agent, or thread selects none.
# Defaults to the first entry in `models`. Set it explicitly so reordering or
# prepending the list cannot silently switch the model every default run uses.
# Must name an entry in `models` - an unknown name is a config-load error.
#
# This is `alpha-free`, and it is load-bearing rather than cosmetic. A default
# that needs an account is not a default a fresh install can use: `union-alpha`
# below needs an OpenRouter key WITH credits, and Install.md gives a new user
# neither. Measured against the live provider, that entry answers HTTP 402
# ("This request requires more credits, or fewer max_tokens") and, with no key at
# all, OpenRouter's Clerk answers 401 - so leaving it as the effective default
# made a fresh install fail on its first turn.
#
# It is also why the memory subsystem was silently dead. `memory.backend_config.
# model: null` is not "no model": it means "the host's default model", and the
# host builds it with `create_chat_model(name=None)`, which resolves
# `default_model` here. Every one of those failures was a single log line while
# the run still reported `status: success` and `GET /api/memory` still answered
# 200 with an empty `facts` list - an amnesiac agent is indistinguishable from a
# new one unless the model it extracts with is one that answers.
#
# Set this to `union-alpha` once you have a funded key, and add
# `fallbacks: [alpha-free]` to that entry (see below) to keep a turn alive when
# the provider is out of credit.
default_model: alpha-free

# Intent-category and cost-tier routing. This is the only executable routing
# source: the model routers prefer these chains and FAIL CLOSED rather than
# naming a model that is not in `models`. Keys are the categories the routers
# understand (quick, deep, ultrabrain, writing, artistry,
# visual-engineering, unspecified-low, unspecified-high) and the tiers
# (frontier, coding, fast, local); values are ordered `models[]` names, index 0
# primary and the rest fallbacks.
#
# Leaving this out is fine - the routers then fall back to advisory suggestion
# chains that name no runnable model, and a routed request degrades honestly
# instead of quietly running on your most expensive model.
# model_routing:
#   enabled: true
#   default_model: null            # null = the configured `default_model`
#   categories:
#     quick: [cheap-model]
#     deep: [flagship-model, cheap-model]
#   tiers:
#     fast: [cheap-model]
#     frontier: [flagship-model]

models:
  - name: union-alpha
    display_name: Union Alpha (OpenRouter)
    description: "Anonymous-provider preview; prompts and completions may be retained. Verify provider terms before sending sensitive data."
    use: langchain_openai:ChatOpenAI
    # OpenRouter retired `stealth/union-alpha` (its own 404 names the successor)
    # and the provider is the only authority on whether a slug exists. The
    # Alpha-side name stays `union-alpha`; only the provider slug moved to
    # `unbiased/pareto`. `openrouter/unbiased/pareto` is still NOT a valid API
    # slug - the CLI-qualified form never is.
    model: unbiased/pareto
    base_url: https://openrouter.ai/api/v1
    api_key: $OPENROUTER_API_KEY
    context_window: 262144
    max_tokens: 16384
    request_timeout: 600.0
    max_retries: 2
    use_responses_api: false
    supports_vision: true
    supports_thinking: false
    supports_reasoning_effort: false
    fallbacks: []
    # Retryable failures (429/5xx/timeouts) can fail over to the keyless
    # free router: add `fallbacks: [alpha-free]` (the entry below). With the
    # keyless router as `default_model` you can also just leave the default
    # alone. Deterministic 4xx (bad key, bad request) still surface immediately.

  # Keyless free-LLM router: no API key, routes across a curated set of
  # public anonymous gateways with per-provider failover, tri-state health,
  # and cooldown backoff (backend ... alpha/models/free_router/). Anonymous
  # gateway reachability changes without notice — best-effort fallback, no
  # SLA. Never send secrets through it. Live health view:
  # GET /api/models/free/catalog
  #
  # This is the shipped `default_model`, so it must work with no account at
  # all. Two details are load-bearing, both found by executing rather than
  # reading:
  #
  #   * It must be `alpha.models.free_router:ChatFreeLLM`, never a plain
  #     `langchain_openai:ChatOpenAI` entry pointing at a keyless base_url.
  #     `ChatOpenAI` always sends an `Authorization` header, and OpenCode Zen
  #     answers 401 "Invalid API key" for a bogus one while accepting none.
  #   * `model` must keep the `free:<gateway>:<model>` prefix. Without it the
  #     whole string is read as a model id and the router honestly reports that
  #     no provider offers it. `auto` lets the router re-rank discovered free
  #     gateways and fail over when one is unavailable. Pin
  #     `free:<gateway>:<model>` only when a specific model's behavior matters;
  #     a pin is a single endpoint and one provider failure ends the run.
  - name: alpha-free
    display_name: Alpha Free (Keyless Router)
    description: "Keyless fallback across public anonymous LLM gateways; prompts/completions may be retained by those gateways. No availability guarantee."
    use: alpha.models.free_router:ChatFreeLLM
    model: auto
    context_window: 128000
    max_tokens: 8192
    request_timeout: 600.0
    max_retries: 2
    supports_vision: false
    # `space-bunny-free` demonstrably reasons and accepts an effort rung. This
    # entry used to declare both of these `false`, which described a *client*
    # limitation rather than the model's: the router discarded
    # `reasoning_content` on the way in and had no way to send `reasoning_effort`
    # on the way out, so a reasoning gateway looked non-reasoning. Both are now
    # fixed in `free_router` (see `chat_model.py` / `catalog.py` /
    # `providers.py`), and the flags state the truth.
    supports_thinking: true
    # Implied by the ladder below; kept explicit because the picker reads it.
    supports_reasoning_effort: true
    # Verified served rungs for this endpoint. The ladder is a CEILING - an
    # unlisted rung is clamped and logged, never sent - so it deliberately stops
    # at `high`: `minimal` is accepted upstream but its effect was not measured,
    # and listing an unverified rung would over-promise the picker.
    reasoning_efforts: [low, medium, high]
    # No `default_reasoning_effort`: omitting the key sends nothing and leaves
    # the gateway's own default in place. Pinning a rung here would replace a
    # provider default we cannot read with a guess.
    # Stated explicitly rather than left to `auto`. `auto` already resolves to
    # `openai` here (`alpha.models.free_router` is registered in
    # `effort_translation._MODULE_STYLES`), so this is documentation of the wire
    # shape these `openai_compat` gateways speak, not a fix for a misdetection.
    reasoning_effort_style: openai
    fallbacks: []

  # Example: Volcengine (Doubao) model
  # - name: doubao-seed-1.8
  #   display_name: Doubao-Seed-1.8
  #   use: alpha.models.patched_deepseek:PatchedChatDeepSeek
  #   model: doubao-seed-1-8-251228
  #   api_base: https://ark.cn-beijing.volces.com/api/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   context_window: 262144     # Total prompt + completion capacity
  #   supports_thinking: true
  #   supports_vision: true
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # Example: Volcengine Coding Plan (one key, multi-vendor gateway)
  # The Coding Plan endpoint (/api/coding/v3) lets you access models from
  # Doubao, GLM, DeepSeek, Kimi, and MiniMax with a single API key.
  # Each model may differ in thinking/vision support - configure per-model.
  #
  # - name: glm-5.2-cp
  #   display_name: GLM-5.2 (Coding Plan)
  #   use: alpha.models.patched_deepseek:PatchedChatDeepSeek
  #   model: glm-5.2
  #   api_base: https://ark.cn-beijing.volces.com/api/coding/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   supports_thinking: true
  #   supports_vision: false
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled
  #
  # - name: deepseek-v4-pro-cp
  #   display_name: DeepSeek-V4-Pro (Coding Plan)
  #   use: alpha.models.patched_deepseek:PatchedChatDeepSeek
  #   model: deepseek-v4-pro
  #   api_base: https://ark.cn-beijing.volces.com/api/coding/v3
  #   api_key: $VOLCENGINE_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   supports_thinking: true
  #   supports_vision: false
  #   supports_reasoning_effort: true
  #   when_thinking_enabled:
  #     extra_body:
  #       thinking:
  #         type: enabled
  #   when_thinking_disabled:
  #     extra_body:
  #       thinking:
  #         type: disabled

  # Example: Z.AI GLM-5.3-Flash (required-thinking workaround)
  #
  # GLM-5.3-Flash cannot disable thinking and only accepts low/high/max effort.
  # Alpha's current generic UI may request disabled thinking or emit
  # minimal/medium, so this profile keeps thinking enabled unconditionally and
  # suppresses generic effort forwarding. Keep the thinking block in the base
  # extra_body: moving it to when_thinking_enabled would let background calls
  # synthesize the invalid thinking.type=disabled + reasoning_effort=minimal pair.
  # clear_thinking=true is intentional for this compatibility workaround: it
  # avoids requiring exact historical reasoning replay after summarization.
  #
  # - name: glm-5.3-flash
  #   display_name: GLM-5.3-Flash
  #   use: alpha.models.patched_deepseek:PatchedChatDeepSeek
  #   model: glm-5.3-flash
  #   api_base: https://api.z.ai/api/paas/v4
  #   api_key: $ZAI_API_KEY
  #   timeout: 600.0
  #   max_retries: 2
  #   temperature: 1.0
  #   top_p: 0.95
  #   max_tokens: 131072
  #   context_window: 1000000
  #   supports_thinking: true
  #   supports_reasoning_effort: false
  #   supports_vision: true
  #   stream_usage: false
  #   extra_body:
  #     thinking:
  #       type: enabled
  #       clear_thinking: true
  #     tool_stream: true

  # Example: OpenAI model
  # - name: gpt-4
  #   display_name: GPT-4
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-4
  #   api_key: $OPENAI_API_KEY # Use environment variable
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 4096          # Per-call output cap
  #   context_window: 128000    # Total prompt + completion capacity
  #   temperature: 0.7
  #   supports_vision: true # Enable vision support for view_image tool
  #   supports_thinking: true
  #   supports_reasoning_effort: true
  #   # The rungs this endpoint actually serves, weakest first. Declaring them is
  #   # what enables the composer effort picker, and it is the ceiling: a request
  #   # above the top is clamped down (and logged) rather than sent and 400'd.
  #   # Allowed: none, minimal, low, medium, high, xhigh, max.
  #   reasoning_efforts: [low, medium, high, xhigh]
  #   default_reasoning_effort: medium

  # Example: OpenAI Responses API model
  # - name: gpt-5-responses
  #   display_name: GPT-5 (Responses API)
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-5
  #   api_key: $OPENAI_API_KEY
  #   request_timeout: 600.0
  #   max_retries: 2
  #   use_responses_api: true
  #   output_version: responses/v1
  #   # Optional, forwarded to ChatOpenAI as-is (default false): send only the new
  #   # turn plus previous_response_id instead of replaying the full history. The
  #   # chained context is still billed as input tokens, and any client-side
  #   # history rewrite (e.g. blocked-write payload elision) is only honored when
  #   # the history is replayed.
  #   use_previous_response_id: false
  #   context_window: 400000
  #   supports_vision: true

  # Example: Ollama (native provider — preserves thinking/reasoning content)
  #
  # IMPORTANT: Use langchain_ollama:ChatOllama instead of langchain_openai:ChatOpenAI
  # for Ollama models. The OpenAI-compatible endpoint (/v1/chat/completions) does NOT
  # return reasoning_content as a separate field — thinking content is either flattened
  # into <think> tags or dropped entirely (ollama/ollama#15293). The native Ollama API
  # (/api/chat) correctly separates thinking from response content.
  #
  # Install: cd backend && uv pip install 'alpha-harness[ollama]'
  #
  # - name: qwen3-local
  #   display_name: Qwen3 32B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://localhost:11434   # No /v1 suffix — uses native /api/chat
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true                    # Passes think:true to Ollama native API
  #   context_window: 32768              # Match the context length served by Ollama
  #   supports_thinking: true
  #   supports_vision: false
  #
  # - name: gemma4-local
  #   display_name: Gemma 4 27B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: gemma4:27b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true
  #   context_window: 32768
  #   supports_thinking: true
  #   supports_vision: true
  #
  # For Docker deployments, use host.docker.internal instead of localhost:
  #   base_url: http://host.docker.internal:11434

  # Example: Anthropic Claude model (with extended thinking)
  # supports_thinking: true is required — without it, Alpha silently falls
  # back to non-thinking mode even when the UI thinking toggle is on.
  # budget_tokens is required by the Anthropic API when thinking.type=enabled
  # (no server default; min 1024; must be less than max_tokens).
  # - name: claude-sonnet-4
  #   display_name: Claude Sonnet 4
  #   use: langchain_anthropic:ChatAnthropic
  #   model: claude-sonnet-4-20250514
  #   api_key: $ANTHROPIC_API_KEY
  #   default_request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 16000         # Per-call output cap
  #   context_window: 200000    # Total prompt + completion capacity
  #   supports_vision: true
  #   supports_thinking: true
  #   when_thinking_enabled:
  #     thinking:
  #       type: enabled
  #       budget_tokens: 4096   # required; min 1024; must be < max_tokens
  #   when_thinking_disabled:
  #     thinking:
  #       type: disabled

  # Example: Claude Opus with adaptive reasoning effort
  # Modern Claude models take a *named* effort level instead of a raw token
  # budget. Declaring `reasoning_efforts` is what puts the effort picker in the
  # composer: the list the user sees is exactly the list below, a request above
  # the ceiling is clamped down (and logged), and a run that requests nothing
  # uses `default_reasoning_effort`. Omit the key and the picker correctly
  # reports that this model has no effort control.
  #
  # `max_tokens` is a hard cap on thinking PLUS reply, so Anthropic's guidance
  # is a large cap at high effort and above — a small one truncates the
  # reasoning itself. Alpha warns when a high rung meets a small cap.
  # - name: claude-opus-4-7
  #   display_name: Claude Opus 4.7
  #   use: langchain_anthropic:ChatAnthropic
  #   model: claude-opus-4-7
  #   api_key: $ANTHROPIC_API_KEY
  #   max_tokens: 32000
  #   context_window: 200000
  #   supports_vision: true
  #   supports_thinking: true
  #   reasoning_efforts: [low, medium, high, xhigh, max]
  #   default_reasoning_effort: high
  #   # Omit this for auto: Alpha detects the wire shape from the client class
  #   # (Anthropic -> output_config.effort, OpenAI -> reasoning_effort, Google ->
  #   # thinking_level, Bedrock -> reasoningConfig, vLLM -> chat-template kwargs).
  #   # Set it only for a gateway whose knob does not match its SDK package.
  #   reasoning_effort_style: auto

  # Example: OpenAI GPT-5.2 with the full reasoning ladder
  # - name: gpt-5-2
  #   display_name: GPT-5.2
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-5.2
  #   api_key: $OPENAI_API_KEY
  #   max_tokens: 32000
  #   context_window: 400000
  #   supports_vision: true
  #   supports_thinking: true
  #   reasoning_efforts: [none, minimal, low, medium, high, xhigh]
  #   default_reasoning_effort: medium
  #   # `max` is intentionally absent: it is Anthropic's rung and this endpoint
  #   # has never heard of it, so declaring it would only produce a 400.

  # Example: Google Gemini via the native SDK
  # `thinking_level` accepts minimal/low/medium/high; "off" is a zero budget
  # rather than a level, and Alpha writes it that way.
  # - name: gemini-3-pro
  #   display_name: Gemini 3 Pro
  #   use: langchain_google_genai:ChatGoogleGenerativeAI
  #   model: gemini-3-pro
  #   gemini_api_key: $GEMINI_API_KEY
  #   max_tokens: 8192
  #   context_window: 1048576
  #   supports_vision: true
  #   supports_thinking: true
  #   reasoning_efforts: [none, minimal, low, medium, high]
  #   default_reasoning_effort: high

  # Example: Google Gemini model (native SDK, no thinking support)
