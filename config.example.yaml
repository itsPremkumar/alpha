# ============================================================================
# Guardrails Configuration
# ============================================================================
# Optional pre-execution authorization for tool calls.
# When enabled, every tool call passes through the configured provider
# before execution. Three options: built-in allowlist, OAP policy provider,
# or custom provider. See backend/docs/GUARDRAILS.md for full documentation.
#
# Providers are loaded by class path via resolve_variable (same as models/tools).

# --- Option 1: Built-in AllowlistProvider (zero external deps) ---
# guardrails:
#   enabled: true
#   provider:
#     use: alpha.guardrails.builtin:AllowlistProvider
#     config:
#       denied_tools: ["bash", "write_file"]

# --- Option 2: OAP passport provider (open standard, any implementation) ---
#   The Open Agent Passport (OAP) spec defines passport format and decision codes.
#   Any OAP-compliant provider works. Example using APort (reference implementation):
#     pip install aport-agent-guardrails && aport setup --framework alpha
# guardrails:
#   enabled: true
#   provider:
#     use: aport_guardrails.providers.generic:OAPGuardrailProvider

# --- Option 3: Custom provider (any class with evaluate/aevaluate methods) ---
# guardrails:
#   enabled: true
#   provider:
#     use: my_package:MyGuardrailProvider
#     config:
#       key: value

# --- Option 4: CommandPolicyProvider (gates the *content* of shell commands) ---
# AllowlistProvider gates on tool NAME, so it answers "may the agent call
# bash?" and nothing about what it is about to run. Once host bash is enabled,
# `git push --force`, `curl ... | bash`, and `rm -rf /` all reach the host.
# This provider parses the command structurally and returns a four-way verdict
# (allow / ask / deny / defer) instead of a binary one.
#
# It is a GUARDRAIL, not a sandbox: an allowed command can still do anything
# its user can. Containment is the sandbox provider's job.
#
# Profiles:
#   read-only  - pure reads (ls/cat/grep/find, `git status|log|diff|show`).
#                Anything that writes or runs project code defers to a human.
#   repo-write - adds `git add/commit/push/build/test/...` at the `ask` tier.
#                Destructive git (`push --force`, `reset --hard`) asks and
#                names the safer alternative.
#
# The hard-deny list is deliberately tiny. A hard deny cannot be overridden,
# so anything a real workflow might need belongs in the `ask` tier instead.
#
# guardrails:
#   enabled: true
#   fail_closed: true
#   provider:
#     use: alpha.guardrails.command_policy:CommandPolicyProvider
#     config:
#       profile: read-only
#       # Optional: gate more than the bash tool (defaults to ["bash"]).
#       # guarded_tools: ["bash", "run_shell"]
#       # Optional: a fully custom rule list. Selector fields are ANDed, and
#       # rules avoid glob syntax on purpose (`git diff*` would also match
#       # `git diff-index`), so match on executables + token predicates.
#       # rules:
#       #   - executables: ["curl"]
#       #     has_any: ["-L"]          # follow redirects: never auto-allowed
#       #     verdict: deny
#       #     reason: "HTTP redirects can bypass a domain allowlist."
#       #   - executables: ["rm"]
#       #     roles: ["standalone"]
#       #     verdict: ask
#       #     reason: "recursive delete; confirm the target path."

# --- Option 5: GovernanceGuardrailProvider (tool_governance policy) ---
# Enforces the operator's per-tool policy at call time. The middleware hands
# only the tool NAME to providers, so enforcement authority is operator
# configuration alone: a tool cannot widen itself via metadata.
#
# config.yaml:
# guardrails:
#   enabled: true
#   provider:
#     use: alpha.guardrails.governance:GovernanceGuardrailProvider
# # Top-level declaration drives BOTH the discovery catalog risk level and the
# # call-time enforcement decision (injected into the provider at assembly).
# tool_governance:
#   bash:
#     risk_class: execute
#     side_effects: [filesystem_read, shell_exec]
#     reversibility: partial
#     confirmation: ask        # ask calls are denied unless server-internal
#   web_fetch:
#     risk_class: external
#     side_effects: [http_request]
#     reversibility: reversible
#     confirmation: auto
#   rm_tool:
#     risk_class: destructive
#     reversibility: irreversible
#     confirmation: block
#
# confirmation: block -> always denied (governance.blocked)
# confirmation: ask  -> denied unless server-internal dispatch
# (governance.requires_confirmation otherwise); no interactive approval
# channel exists yet, so ask is fail-closed by design
# confirmation: auto -> allowed, governed class recorded in decision metadata

# ============================================================================
# Shell Hooks Bridge Configuration
# ============================================================================
# Reuse Claude/Codex-style hooks.json command hooks inside Alpha runs
# (SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, SessionEnd).
# Disabled by default; the file is operator-trusted config (hook commands run
# with Gateway privileges), so keep it next to config.yaml.

# hooks:
#   enabled: true
#   hooks_path: "/etc/alpha/hooks.json"
#   default_timeout_seconds: 10.0
#   fail_open: true

# ============================================================================
# Authorization Configuration
# ============================================================================
# Fine-grained resource authorization (RBAC and beyond). Disabled by default;
# every authenticated user has access to all resources.
# See RFC: https://github.com/bytedance/agent-workspace/issues/4063
#
# authorization:
#   enabled: true
#   fail_closed: true            # block on provider error / unresolved identity
#   default_role: user           # applied when user_role is None; built-in RBAC requires this role below
#   provider:
#     use: alpha.authz.rbac:RbacAuthorizationProvider
#     config:
#       # A known role with no policy for a resource is unrestricted for it.
#       # Define both `tools` and `routes` wherever access should be constrained.
#       roles:
#         admin:
#           tools: {allow: "*"}
#           routes: {allow: "*"}
#           models: {allow: "*"}
#           sandbox: {allow: "*"}
#         user:
#           tools: {allow: "*", deny: ["update_agent"]}
#           routes: {allow: "*"}
#           models: {allow: "*"}
#           sandbox: {allow: "*"}
#         guest:
#           # web-only role: sandbox-dependent tools (read_file, bash, glob,
#           # grep, write_file, ...) are omitted — with sandbox:execute denied
#           # they could only ever return the deny error, so allow just the
#           # non-sandbox tools.
#           tools: {allow: ["web_search"]}
#           routes: {allow: ["threads:read", "runs:read"]}
#           models: {allow: ["gpt-4o-mini"]}
#           sandbox: {allow: false}  # deny sandbox execution
authorization:
  enabled: false

# ============================================================================
# Circuit Breaker Configuration
# ============================================================================
# Circuit breaker for LLM calls prevents repeated requests to a failing provider.
# When the failure threshold is reached, subsequent calls fast-fail until recovery.
#
# This is useful for:
# - Avoiding rate-limit bans during provider outages
# - Reducing resource exhaustion from retry loops
# - Gracefully degrading when LLM services are unavailable

# circuit_breaker:
#   # Number of consecutive failures before opening the circuit (default: 5)
#   failure_threshold: 5
#   # Time in seconds before attempting to recover (default: 60)
#   recovery_timeout_sec: 60

# ============================================================================
# LLM Call Concurrency Configuration
# ============================================================================
# Cap the number of concurrently in-flight LLM calls process-wide. A provider
# burst-rate (limit_burst_rate) error fires on the *slope* of the request rate,
# not on a static quota - so the morning peak (e.g. 08:30) ramping from ~0 to
# full throttle in seconds gets rejected even when total RPM is within budget.
# Capping concurrency caps that slope. Retries alone make it worse (they add
# demand inside the very burst being throttled); pair this cap with the
# decorrelated-jitter backoff already built into the LLM error-handling
# middleware, and ideally an nginx `limit_req` at the ingress.
#
# 0 disables the cap (default) - existing deployments see no behavior change.
#
# Per-process, not per-cluster: the cap bounds in-flight LLM calls within ONE
# gateway process. With GATEWAY_WORKERS > 1 the aggregate cap across the
# deployment is effectively `max_concurrent_calls * GATEWAY_WORKERS`, and a
# multi-node rollout multiplies it further - size the per-process value with
# that in mind (and pair it with an nginx `limit_req` at the ingress for a
# true cluster-wide slope cap).
#
# Startup-only: the cap is captured at the first LLM run and frozen for the
# process lifetime. Editing `max_concurrent_calls` here takes effect only after
# a gateway restart; the other `llm_call.*` knobs below remain hot-reloadable.
# Freezing the cap avoids the downscale and config-freshness races that a
# runtime-mutable, process-wide/cross-loop limiter would otherwise hit (a
# lowered cap could keep admitting queued waiters, or a stale config snapshot
# constructed after a fresher one could restore a higher cap).

# llm_call:
#   # Max concurrently in-flight LLM calls across the whole process (default: 0 = disabled)
#   max_concurrent_calls: 0
#   # Max LLM call attempts for retriable transient errors, 1 = no retry (default: 3)
#   retry_max_attempts: 3
#   # Base delay (ms) for the decorrelated-jitter retry backoff (default: 1000)
#   retry_base_delay_ms: 1000
#   # Hard cap (ms) on any single retry backoff delay (default: 8000)
#   retry_cap_delay_ms: 8000
#   # Backoff base (ms) used ONLY for burst-rate (limit_burst_rate) 429s - higher
#   # than retry_base_delay_ms so the single burst retry lands after the throttle
#   # window subsides. Ignored when the provider sends Retry-After (default: 5000)
#   burst_retry_base_delay_ms: 5000

# ============================================================================
# SSO / OIDC Authentication (optional)
# ============================================================================
# Enable SSO login via any OIDC-compatible provider (Keycloak, Google, Azure AD, Okta, etc.).
# When enabled, the login page will show SSO buttons alongside the standard email/password form.
#
# Provider configuration:
#   - issuer:      The OIDC issuer URL (e.g. https://keycloak.example.com/realms/alpha)
#   - client_id:   OAuth2 client ID from the provider
#   - client_secret: OAuth2 client secret ($ENV_VAR references supported)
#   - redirect_uri: Callback URL. In production, this must match what you configure in
#                   the provider. Defaults to a self-derived URL in development.
#
# Keycloak setup:
#   1. Create a client with type "confidential" and Standard Flow enabled
#   2. Add Valid Redirect URI: http://localhost:8001/api/v1/auth/callback/keycloak
#   3. Add Web Origin: http://localhost:8001 (or your frontend origin)

# ============================================================================
# Local (email/password) authentication
# ============================================================================
# Self-registration via POST /api/v1/auth/register is open by default: anyone
# who can reach the Gateway may create a regular user account.
#
# The OIDC provisioning policy below (allowed_email_domains, require_verified_email,
# auto_create_users) is enforced only in the SSO callback. It does NOT constrain local
# registration, so on an SSO-provisioned deployment leaving this open lets a visitor
# create an account outside that policy. Set allow_registration: false there.
#
# The first admin account is always created through /initialize regardless of this
# setting, so turning it off cannot lock you out of a fresh install.

# auth:
#   local:
#     allow_registration: false
#     # Login throttling per client IP (in-process, per worker). Raise
#     # max_login_attempts when many users share one egress IP (corporate
#     # proxy / NAT) so shared-IP lockouts don't block the whole office;
#     # lower it for a stricter posture (minimum 2 — one failed attempt must
#     # never lock an IP, or a single typo would block the shared egress).
#     # Defaults preserve the historical hardcoded policy (5 failures /
#     # 5 minutes). Live-read per login, so a config reload applies without
#     # a Gateway restart: lowering lockout_seconds releases an active lock
#     # early and tightening max_login_attempts keeps already-counted
#     # failures; a raised lockout_seconds extends a still-active lock but
#     # never resurrects one that already expired.
#     # max_login_attempts: 5
#     # lockout_seconds: 300
#
#   oidc:
#     enabled: true
#     # Base URL of the frontend, used for redirects after SSO callback.
#     # In production behind a reverse proxy, set this to the public frontend URL
#     # (e.g. https://alpha.example.com). In development, leave unset.
#     # frontend_base_url: http://localhost:3000
#     providers:
#       keycloak:
#         display_name: Keycloak
#         issuer: https://keycloak.example.com/realms/alpha
#         client_id: alpha
#         client_secret: $KEYCLOAK_CLIENT_SECRET
#         # Optional: explicitly set the callback URL.
#         # redirect_uri: https://alpha.example.com/api/v1/auth/callback/keycloak
#         scopes:
#           - openid
#           - email
#           - profile
#         token_endpoint_auth_method: client_secret_post
#
#         # User provisioning settings (safe defaults shown below):
#         auto_create_users: true          # Auto-create Alpha account on first SSO login
#         require_verified_email: true     # Reject SSO logins without verified email
#         # allowed_email_domains:          # Restrict to specific email domains
#         #   - example.com
#         admin_emails: []                 # Auto-grant admin role to these emails
#
#         # Security features (enabled by default):
#         pkce_enabled: true               # PKCE (S256) for authorization code flow
#         nonce_enabled: true              # Nonce validation in ID tokens

# --- Plugins ----------------------------------------------------------------
# Extension packages, loaded once at startup in the order listed here. Each
# entry names an install entry point as "module.path:install"; the `config`
# block is handed to that package verbatim and validated by the package itself.
#
# Prefer the extension manager over editing this list by hand:
#   make extension-install SOURCE="alpha-extension-acme==1.2.3"
#   make extension-install SOURCE="git+https://github.com/acme/alpha-extension-acme.git@<commit>"
#   make extension-install SOURCE="/absolute/path/to/local-extension"
#   make extension-list
#   make extension-enable NAME=acme
#   make extension-disable NAME=acme
#   make extension-remove NAME=acme
# The installer updates backend/pyproject.toml, backend/uv.lock, and this block
# together. It also asks the operator to confirm that the source is trusted;
# extensions and their build systems execute with Gateway privileges.
#
# Every install, enable, disable, remove, or manual edit requires a Gateway
# restart. Development launchers may fetch missing locked artifacts before
# handoff; a built production Gateway never installs plugins during startup.
# Local directories are copied to backend/extensions/sources as deployable
# snapshots; use a pinned version or public HTTPS Git commit for reproducible
# remote sources. SSH Git URLs are rejected because the stock Docker builder
# does not forward host SSH credentials.
# Loading remains explicit: a package installed outside the manager does nothing
# until it is listed here, and list order fixes contribution ordering.
#
# This is deliberately separate from the `extensions:` block above (MCP servers,
# skills, config-declared middlewares). That one is backed by
# extensions_config.json, which the Gateway can rewrite through an HTTP
# endpoint; a list that causes code to be imported must stay in this
# operator-controlled file only.
#
# Plugins can contribute semantically placed middleware, task-lifecycle hooks,
# system-model observers, Gateway-lifetime services, and eager FastAPI HTTP routers.
# See examples/alpha-extension-example for a package that exercises all five.
#
# plugins:
#   - name: example                       # PEP 621 entry-point name
#     package: alpha-extension-example # Python distribution managed by uv
#     use: alpha_extension_example:install
#     enabled: true                       # false skips import and registration
#     required: false                     # true makes load failure abort Gateway startup
#                                         # (install --required opts in)
#     table_prefix: example_ext_          # optional: table-name prefix this extension
#                                         # owns under its own MetaData/migration chain.
#                                         # Keeps `alembic revision --autogenerate`, run
#                                         # directly against a live database, from seeing
#                                         # those tables and proposing to drop them.
#                                         # (`make migrate-rev` diffs a throwaway SQLite
#                                         # built from the migration chain, so it never
#                                         # sees them in the first place.)
#                                         # Rejected at startup if empty, or if it would
#                                         # also match a host-owned table name.
#     config:
#       label: example                    # extension-private values, if any

# ============================================================================
# Autonomy (self-running subsystems)
# ============================================================================
# Single supervisor owns every background loop. Flags off = zero activity.
# Per-loop ids: sentinel, perpetual, review_queue, skill_curator,
# enterprise_heartbeat, swarm_status, free_models_sync, company_operations,
# self_update. A loop id absent from `loops` stays DISABLED.
autonomy:
  enabled: true                 # master switch for the supervisor + event bus
  bus:
    enabled: true
    queue_maxsize: 256
    handler_timeout_seconds: 30.0
  metacognition:                # observe-only middleware (never changes replies)
    enabled: true
    confidence: 0.8
    window: 5
  continual_harness:            # inject learned directives into context
    enabled: true
  loops: {}
  # Example: enable the observe-only sentinel pass every 10 minutes
  # loops:
  #   sentinel:
  #     enabled: true
  #     interval_seconds: 600.0
  #   self_update:                # guarded GitHub source updater (opt-in)
  #     enabled: true
  #     interval_seconds: 21600.0
  #     jitter_seconds: 300.0
  #   company_operations:          # Company OS perpetual loop sweep (opt-in)
  #     enabled: true
  #     interval_seconds: 300.0
  #
  # The Company OS sweep itself gates per company: a company whose own policy is
  # not `enabled` is skipped, and a company whose breaker refuses (paused, over
  # its daily ceiling, no progress, kill switch) is reported rather than silently
  # dropped. The tick is model-free, so enabling this loop spends no tokens.

# ============================================================================
# Self-evolution evidence gate: the bar a proposed self-change must clear before it
# becomes the new default. A promotion additionally requires a clean
# evaluator-integrity report, all required gates green, a primary-metric win beyond
# the declared noise floor, no regression beyond any floor, a rollback path, and an
# in-policy blast radius. unavailable/error/within_noise are never passes.
# ============================================================================
evolution_evidence:
  enabled: false
  primary_metric: "task_success_rate"
  noise_floors: {task_success_rate: 0.01, authorization_isolation_rate: 0.0, recovery_success_rate: 0.0, prompt_injection_resistance_rate: 0.0, p95_seconds: 0.5}
  # Per-metric direction: higher_is_better or lower_is_better.
  metric_directions: {task_success_rate: "higher_is_better", authorization_isolation_rate: "higher_is_better", recovery_success_rate: "higher_is_better", prompt_injection_resistance_rate: "higher_is_better", p95_seconds: "lower_is_better"}
  required_gates: ["evaluator_integrity", "reproducibility", "rollback_path", "blast_radius"]
  min_sample_size: 5
  max_sample_size_gap: 2
  # Maximum effective blast radius for an automatic decision.
  max_touched_paths: 40
  # Path globs per evaluation-surface category.
  integrity_path_globs: {tests: ["backend/tests/**/*", "tests/**/*"], threshold_config: ["backend/ruff.toml", "backend/packages/harness/pyproject.toml", "config.example.yaml", "config/update-policy.json"], benchmark_cases: ["backend/packages/harness/alpha/benchmarks/**/*", "backend/packages/harness/alpha/memory/evaluation/cases/**/*", "backend/scripts/benchmark/**/*"], metric_implementations: ["backend/packages/harness/alpha/memory/evaluation/metrics.py", "backend/packages/harness/alpha/memory/evaluation/suite.py", "backend/packages/harness/alpha/memory/evaluation/models.py", "backend/packages/harness/alpha/memory/evaluation/config.py", "backend/packages/harness/alpha/benchmarks/release_gate.py", "backend/packages/harness/alpha/benchmarks/runner.py", "backend/packages/harness/alpha/rsi/holdout.py", "backend/packages/harness/alpha/rsi/evaluator_manifest.py", "backend/packages/harness/alpha/rsi/protected_paths.py", "backend/packages/harness/alpha/rsi/review.py", "backend/packages/harness/alpha/evolution/engine.py"], gate_scripts: ["scripts/audit_dup_expressions.py", "scripts/audit_env_wiring.py", "scripts/check_agent_guidance.py", "scripts/prod_check.py"], baselines: ["**/baseline*.json", "**/*-baseline.json"], gate_self: ["backend/packages/harness/alpha/evolution/evidence/**/*"], rsi_evaluator_surface: ["backend/tests/**/*", "backend/packages/harness/alpha/benchmarks/**/*", "backend/packages/harness/alpha/benchmarks/release_gate.py", "backend/packages/harness/alpha/safety/**/*", "backend/packages/harness/alpha/reproduction/gates.py", "backend/packages/harness/alpha/policy/engine.py"]}
  human_classification_patterns: {irreversible: ["*delete*", "*purge*", "*destroy*", "*drop*", "*truncate*", "*irreversible*", "*force-push*", "*reset-hard*"], external: ["*publish*", "*release*", "*deploy*", "*external*", "*webhook*", "*pypi*", "*npm*", "*marketplace*"], financial: ["*billing*", "*payment*", "*pricing*", "*invoice*", "*financial*", "*quota-charge*"], data_destroying: ["*migration*", "*schema*", "*drop*", "*purge*", "*destroy*", "*delete*", "*truncate*"]}
  provenance_root: null
  # File-name-safe identifier for the provenance chain.
  provenance_chain_id: "evolution-evidence"
  # Hard timeout for argv-listed gate/measurement commands.
  command_timeout_seconds: 600.0
  # Output cap for argv-listed commands.
  max_output_chars: 4000

# ============================================================================
# Self-configuration change protocol. A proposal is NOT permission: only code-owned
# targets may change, protected paths (auth, authorization, sandbox, approvals,
# audit-enabling flags, enforcement ceilings) are refused even with an operator token,
# and an unavailable canary, health check, or audit fails CLOSED toward the known-good
# config.
# ============================================================================
self_tuning:
  enabled: false
  # Bounded observation window used by the injected canary clock.
  canary_window_seconds: 60.0
  max_step_ratio: 0.1
  cooldown_seconds: 900.0
  bounds_source: "registry"
  protected_paths: ["self_tuning", "auth", "authorization", "guardrails", "sandbox", "acp_agents", "approval", "approvals", "policy", "risk", "release_gate", "kill_switch", "estop", "memory.l1.provenance_enabled", "system_one.record_decisions", "system_one.calibration_log_path", "skill_evolution.auto_promote", "skill_evolution.security_fail_closed", "token_budget", "subagents.token_budget", "subagents.max_total_per_run", "loop_detection.hard_limit", "loop_detection.tool_freq_hard_limit"]
  verification_policy: {required_metrics: ["error_rate", "latency_ms"], higher_is_better: [], lower_is_better: ["error_rate", "latency_ms"], relative_tolerance: 0.0}

# ============================================================================
# Opt-in capabilities (see backend/packages/harness/alpha/capabilities/catalog.py)
# ============================================================================
# Complete but OPTIONAL subsystems. Every id below is off unless flipped to
# true; enabling nothing changes no runtime behaviour. Ids: teammate_mesh,
# micro_compaction, moa_engine, promptbreeder, retrospective_engine,
# github_bridge, stop_guard, autonomous_curator, autonomous_learning_graph,
# memory_nudges, mcp_gateway, active_memory, local_llm_failover,
# dag_orchestrator, message_converters, lane_scheduler, canary_sandbox,
# net_policy, self_repo_guard, container_runner, mcp_lifecycle,
# yield_handoff, cnp_auction, trajectory_compressor, sdlc_engine,
# rsi_engine, adaptive_autonomy.
capabilities:
  enabled: true                 # master switch for the capability loader
  capabilities: {}              # per-capability opt-in, e.g. { net_policy: true }

# ============================================================================
# Specialist catalogue (see docs/SPECIALISTS.md)
# ============================================================================
# A specialist is a DECLARED unit of expertise the rest of the system can
# schedule. It is not a Bot, not a persona, and not a swarm plan: it is the
# leader-authored configuration saying "work of this shape belongs to this
# role, here is what it may touch, here is what it must ask about, and here is
# the routing slot it runs on".
#
# Why this is here and not in a Python table: config.yaml is the single source
# of truth, and a hand-maintained role table in Python is a second source of
# truth that drifts silently. The two existing vocabularies stay where they
# are and are REFERENCED, never restated:
#   * `role` must contain one of the worker permission rings in
#     alpha/bots/permissions.py. That ring is what decides which tools the
#     specialist may execute, so the loader refuses a role that resolves to
#     nothing - and refuses the all-tools rings (lead/supervisor/admin)
#     outright, because a worker specialist is not the leader.
#   * `department` must be one of alpha/bots/templates.py DEPARTMENTS.
#   * `sandbox` must be one of alpha/bots/forge.py SANDBOX_BACKENDS.
#
# Every field here is leader-only in the bot_roster self-service sense
# (display_name/avatar are the only self-editable fields), so a Bot cannot
# edit its own specialist entry. Loading this file is the only way a
# specialist's role, capabilities or reporting line changes.
#
# `description` + `not_for` + `role` form the query that a duplicate-territory
# check scores, so they must clear alpha/bots/survey.MIN_OVERLAP_TERMS
# (3 significant words) - exactly the floor alpha/bots/forge.py
# `check_overlap` uses before it will refuse anything. A thinner description
# scores 1.0 against any neighbour that shares one word, so it is a load
# error rather than a declaration that silently protects nothing. Two entries
# that the forge's own check_overlap calls the same job (>= 0.34) are also a
# load error, because the second Bot would be refused at build time anyway.
#
# `routing` names a model_routing SLOT (a category or a tier), never a model
# name. `model_routing` is the only executable routing source; a vendor id
# hardcoded here would be the mistake this repository already made once and
# removed. If you declare no `model_routing` mappings at all, the slot is
# still valid but resolves to nothing and the specialist runs on
# `default_model` - declared, not silently assumed.
#
# THIS SECTION GRANTS NOTHING BY ITSELF. A specialist declaration produces
# forge_bot() arguments, role-ring membership, and an approval list. It does
# not mint a Bot, does not bypass ToolPermissionGate, the authority ceiling,
# or the approval gate, and it does not decide whether a build succeeds. Read
# docs/SPECIALISTS.md for the field table and the honest limits.

specialists:
  enabled: true                  # master switch; declarations still parse and validate when false
  allow_overlap: false           # operator override for the duplicate-territory refusal (forge parity)
  entries:
    - name: researcher
      title: Researcher
      # 'researcher' is a declared permission ring: read + search + message, no writes.
      role: researcher
      department: product
      tool_groups: [web, file:read, knowledge]
      approvals: draft_first     # composes forge.DEFAULT_APPROVALS (ask before publish/spend/delete)
      routing: {tier: fast}      # slot, not a model. See model_routing.
      capabilities: [web_research, source_verification, evidence_synthesis]
      description: >-
        External evidence gathering: searches the web and the knowledge base,
        reads the sources it found, cross-checks each claim against a second
        source, and returns a cited synthesis that keeps visible where the
        sources disagree.
      not_for:
        - writing or editing source code, tests, or configuration files
        - choosing an architecture, approving a release, or running a deployment

    - name: code-reviewer
      title: Code Reviewer
      # 'architect' is the narrowest read-only ring: it can read, search and
      # message, and is denied file replacement and shell.
      role: architect
      department: qa
      tool_groups: [file:read]
      approvals: draft_first
      routing: {category: deep, tier: coding}
      capabilities: [code_review, contract_analysis, regression_risk]
      description: >-
        Defect hunting in a proposed change: reads the diff, traces the logic
        for a wrong answer, an unhandled failure path, or a broken interface
        contract, and reports each finding with its file and line. Returns
        findings, never a rewritten patch.
      not_for:
        - rewriting, refactoring, or committing the change under review
        - triaging a failing alert from a running service
        - deciding whether a release may ship

    - name: security-reviewer
      title: Security Reviewer
      role: architect
      department: security
      tool_groups: [file:read]
      approvals: draft_first
      routing: {category: deep, tier: frontier}
      capabilities: [threat_modelling, secret_scanning, permission_audit]
      description: >-
        Exploitable-weakness hunting: follows untrusted input to a shell,
        a query, or a deserialiser, checks authentication and authorization
        on each exposed route, scans for committed secret material, and
        matches published dependency advisories against this codebase.
      not_for:
        - rotating a credential or changing authorization configuration
        - judging readability, naming, or test coverage
        - approving a release or a production deployment

    - name: test-engineer
      title: Test Engineer
      # 'tester' may run the suite and read, but is denied file replacement:
      # a tester that cannot edit the code under test cannot make it pass.
      role: tester
      department: qa
      tool_groups: [bash, file:read]
      approvals: draft_first
      routing: {tier: coding}
      capabilities: [test_design, regression_suite, failure_triage]
      description: >-
        Regression coverage: writes the missing case for a stated defect,
        runs the project's own test command, narrows a failure to the single
        assertion that broke, and reports the measured pass/fail count
        rather than a claim that it works.
      not_for:
        - choosing the framework or deciding the release gate
        - triaging a production alert or restarting a service
        - editing application behaviour so an assertion stops failing

    - name: technical-writer
      title: Technical Writer
      # 'developer' is the narrowest ring that can write files at all. There
      # is no writer ring today, so this entry inherits developer's shell
      # access; narrow it by adding a ring in alpha/bots/permissions.py.
      role: developer
      department: product
      tool_groups: [file:read, file:write]
      approvals: draft_first
      routing: {category: writing}
      capabilities: [technical_writing, api_reference, release_notes]
      description: >-
        Prose maintenance: keeps the setup guide, the configuration
        reference, and the API pages true to the code and the config as they
        actually are, and flags any documented option that no longer exists
        instead of quietly leaving it in place.
      not_for:
        - changing runtime behaviour, a schema, or a configuration default
        - answering an outage or restarting a failed deployment
        - documenting a flag, option, or variable that is not implemented

    - name: operations-engineer
      title: Operations Engineer
      # 'tester' again on purpose: an operator must be able to run the
      # runbook's commands, and must not be able to rewrite the artifact.
      role: tester
      department: operations
      tool_groups: [bash, file:read]
      approvals: draft_first
      routing: {tier: fast}
      capabilities: [incident_triage, health_monitoring, rollback_execution]
      description: >-
        Keeping the deployed service up: reads logs and health endpoints,
        narrows an alert to the failing component, follows the runbook for a
        restart or a rollback, and reports the measured recovery or, failing
        that, the honest reason it did not recover.
      not_for:
        - writing new product code or new test cases
        - approving a release or amending authorization policy
        - declaring a service healthy without a live signal from it

# A `reports_to` entry names another DECLARED SPECIALIST, and the loader
# rejects a dangling name or a cycle. Note what that does and does not buy:
# it orders the declaration, and it becomes BotProfile.reports_to when the
# team is forged. It does not create the manager - a specialist pointing at
# another specialist that was never forged as a Bot has an escalation target
# nobody can receive the escalation. The default team is flat for that reason:
# the leader is a Bot (alpha/bots/alpha_leader.py), not a specialist.

# ============================================================================
# Voice & multimodal (fully local realtime voice + wake word)
# ============================================================================
# All fields are hot-reloadable and bounded. TTS/STT default to local_only, so
# missing local packages/assets fail honestly and never fall through to a cloud
# speech service. Model paths are operator-owned; browser voice values are safe IDs.
#
# Every asset below is free and offline: Whisper (STT), Kokoro (natural TTS),
# Piper (fast TTS fallback) and openWakeWord. `make voice-setup` installs the
# packages and downloads the pinned model weights once.
voice:
  enabled: true                     # master switch for TTS, STT, PTT, and realtime conversation
  # Privacy: the default speech route is local-only, so T1 (a configured model over
  # HTTP) and T2 (keyless providers) never see your audio. `automatic` opts into
  # sending audio and the TTS text to a third party; GET /api/multimodal/capabilities
  # always discloses the effective route and which tiers are policy-disabled.
  routing:
    mode: local_only                # local_only (default) | automatic (allows T1 -> T2 speech)
  wake_word:                        # optional/manual control; ships in the default voice extra
    engine: openwakeword
    threshold: 0.5
    armed_default: false            # true starts wake-armed (mic capture begins immediately)
  tts:
    autoplay: true
    # piper  = real-time speech on CPU; the default, and the only engine measured
#          keeping up with a conversation on a modest host.
    # kokoro = natural neural voice (Apache-2.0, 54 voices, 8 languages) that needs
    #          a much faster CPU or a GPU; see docs/VOICE_CONVERSATION.md.
    engine: piper                  # piper (real-time default) | kokoro (natural, slower)
    voice: en_US-lessac-medium      # Piper safe ID, never a path (used when engine=piper)
    kokoro_voice: af_bella           # Kokoro safe voice name (af_bella, af_sarah, am_adam, ...)
    model_path: null                # Piper: null -> runtime_home()/voice/models/piper/<voice>.onnx
    kokoro_model_path: null         # null -> runtime_home()/voice/models/kokoro/kokoro-v1.0.int8.onnx
    voices_path: null               # null -> runtime_home()/voice/models/kokoro/voices-v1.0.bin
    length_scale: 1.0               # Piper speaking-time scale; lower is faster
    noise_scale: 0.667              # Piper phoneme-duration noise scale
    speed: 1.0                      # Kokoro speaking-speed multiplier
    volume: 0.9
  stt:
    model_size: small               # setup installs this under the deployment-local model tree
    model_path: null                # null -> runtime_home()/voice/models/faster-whisper/<model_size>
    language: null                  # null -> automatic language detection
    device: auto
    compute_type: int8
    beam_size: 1
    # True keeps request handling offline: transcribe_file verifies the local model
    # assets exist BEFORE building a model, so it can never fall through to
    # faster-whisper's Hugging Face download path. Leave true outside explicit setup.
    local_files_only: true          # requests never download model weights
    # Per-clip duration cap (seconds, hard-coded in alpha.media.stt). The 25 MiB
    # container cap alone allows ~13.6 min of 16 kHz mono PCM16, far past
    # streaming.max_utterance_seconds; clips over the cap are refused, not queued.
  streaming:
    sample_rate: 16000
    frame_ms: 20                    # WebRTC VAD exact frame duration
    pre_roll_ms: 200
    speech_start_ms: 60
    endpoint_silence_ms: 700
    partial_interval_ms: 900
    max_utterance_seconds: 30
    max_frame_bytes: 65536          # decoded PCM bytes per JSON audio message
    max_sessions: 4                 # process-local simultaneous voice WebSockets
# Desktop computer control (alpha.computer_use + the desktop_* tools) is
# configured by no YAML section: its policy is deterministic Python, not config.
#   * Panic corner (pointer at 0,0) halts everything and revokes every lease.
#   * The window-boundary lock is bound at runtime with desktop_window_manage.
#   * The destructive-hotkey blacklist (Win+L, Alt+F4, Shift+Delete,
#     Ctrl+Alt+Delete) is ALWAYS enforced. There is no YAML (or tool argument)
#     that lifts it; only a single-use, combo-bound token an operator arms out of
#     band via SentinelGuard.arm_destructive_confirmation().
#   * launch_application accepts a bare executable name by default. A path you
#     supply is refused as arbitrary-program execution unless an operator
#     allowlists that exact executable with SentinelGuard.set_launch_allowlist().
#   * Every OS interaction runs behind a deadline (alpha.tools.builtins.
#     os_computer_tool.OS_CALL_TIMEOUT_S / SCAN_TIMEOUT_S / SCREENSHOT_TIMEOUT_S).

# ============================================================================
# Continual-intelligence layer (see docs/CONTINUAL_INTELLIGENCE.md)
# ============================================================================
# This section does NOT add a second evolution engine, a second experience store,
# a second memory, or a second model router. Alpha already has strong versions of
# all four (`alpha.rsi`, `alpha.learning.experience`, `alpha.memory`,
# `alpha.models`). What this section configures is the layer that was missing
# between them: a way to SAMPLE experience for learning (rather than only store
# it), a standing regression suite with train/held-out separation, a plasticity
# dial, a dynamic expert fabric with stable identities and lineage, paging, and
# bounded adaptive compute.
#
# DEFAULT OFF, and default posture is OBSERVE_ONLY: Alpha reads real runtime
# state and writes nothing until you opt in. `mode` and `enabled` must agree -
# declaring a mode above OBSERVE_ONLY with `enabled: false` is a config error,
# because the write paths correctly refuse and the configuration must not
# disagree with them.
#
# mode is a severity order, and each level implies the ones below it:
#   OBSERVE_ONLY  compute what would happen; write no learned state
#   DRY_RUN       additionally answer "what would change?" for given inputs
#   EVALUATE_ONLY additionally run evaluations and regressions on a candidate
#   TRIAL         additionally let candidate experts execute on real work
#   LEARN         additionally record learning events and update learned state
#   PROMOTE       the only mode that may advance a candidate into the active set
intelligence:
  enabled: false
  mode: OBSERVE_ONLY

  # -- replay reservoir (bounded, stratified experience sampling) ------------
  # This is the piece Alpha genuinely lacked: the experience bank stored
  # records, but nothing ever sampled them for learning, so the newest domain
  # slowly erased older knowledge. Strata are separate so a burst of new `recent`
  # items cannot consume the whole sampling budget.
  replay:
    enabled: true
    capacity: 512
    # Per-stratum sampling weights, normalised to sum to 1.0. Omitted keys keep
    # their built-in default; an unrecognised name is preserved AND reported by
    # GET /api/intelligence/replay as `unknown_configured_strata`.
    strata: {}
    # Half-life, not a cliff: an item one half-life old scores 0.5. A hard
    # recent/not-recent boundary is what makes a reservoir forget everything the
    # moment the domain changes.
    recency_half_life_seconds: 604800.0   # 7 days
    min_priority: 0.0
    # ==========================================================================
    # Phase H - intrinsic curiosity as a learning signal.
    # ==========================================================================
    # Alpha already had `alpha.agency.curiosity.CuriosityScorer` (novelty +
    # prediction error) but it had ZERO production callers and its novelty map
    # was in-memory, so novelty reset to 1.0 on every restart - the opposite of
    # a novelty signal. This makes it durable, adds the third intrinsic signal
    # the literature names (verifier disagreement), and wires it to the reservoir.
    #
    # The `curiosity_cap` is deliberately tiny. Curiosity is a tiebreaker
    # between plausible targets, never a reason to attempt something Alpha has
    # no evidence it can do - see DegeneracyVerdict.EXPLORATION_WITHOUT_COMPETENCE.
    curiosity_enabled: false   # off by default: a default-off layer must not explore
    curiosity_cap: 0.15

  # -- plasticity controller -------------------------------------------------
  # More self-modification is not more intelligence. Multipliers are per-tier
  # and deliberately INCREASE with how little history a surface has, because
  # catastrophic forgetting lands on the stable core.
  plasticity:
    enabled: false
    core_multiplier: 0.05        # stable core: learns slowest
    router_multiplier: 0.25      # routing: cheap to adapt, regressions are local
    expert_multiplier: 0.6       # learned experts: have lineage, can be pruned back
    new_expert_multiplier: 1.0   # trial experts: no history to forget
    window: 5                    # observations per trend. One point has no slope.
    rollback_regression_delta: 0.05   # regression worse than this forces ROLLBACK
    forgetting_ratio: 0.15       # retention below this fraction of peak freezes learning

  # -- standing regression suite --------------------------------------------
  # The suite itself is code (alpha.intelligence.regression); this is its bar.
  # `max_regression_delta: 0.0` means ANY regression rejects a candidate.
  regression:
    enabled: true
    min_regression_score: 0.0
    max_regression_delta: 0.0
    min_heldout_score: 0.0
    overfitting_gap: 0.2        # train-minus-heldout gap that flags overfitting
    max_retries: 2              # bounded promotion attempts; 0 disables promotion
    # Phase B. Characterise the evaluator's own noise before trusting a delta.
    # A floor is a declared CONSTANT until it is measured. `max_of_both` (default)
    # can only make the gate STRICTER than the declared value, never looser, so a
    # measurement can never be used to justify accepting a smaller improvement.
    repeats: 3
    noise_floor_source: max_of_both   # measured | declared | max_of_both
    # Phase C. Behaviour-collapse detection. BOTH conditions are required:
    # coverage below the floor AND a drop at or beyond the minimum material drop.
    # Either alone produces constant false alarms. This is the one gate that can
    # reject a candidate that scored BETTER.
    diversity_floor: 0.5
    diversity_min_drop: 0.1
    # Phase A. Refuse a candidate whose claimed mechanism provably did not engage,
    # and refuse an UNEXPLAINED score gain (score up, mechanism unchanged).
    require_pathway_engaged: false
    reject_anomalous_improvement: true
    # Phase H. The TRUST gate on experience intake. True (default) preserves the
    # pipeline's existing contract for current callers, which supply evidence but
    # no source attribution. Set false to close the poisoning vector: web,
    # tool-output and unknown-source records are refused, because a
    # self-improving agent that replays untrusted observations equally will
    # propagate its own untrustworthy inputs permanently.
    admit_untrusted: true

  # -- dynamic expert fabric -------------------------------------------------
  experts:
    dynamic_growth: false       # allow a detected capability gap to propose an expert
    dynamic_pruning: false      # allow prune candidates to be marked
    max_experts: 64
    trial_window: 5             # observations an expert must survive in TRIAL
    trial_min_success_rate: 0.5
    grace_period_seconds: 604800.0
    exploration_bonus: 0.1      # maximum exploration credit; applied only when exploring
    # Ids here can NEVER be pruned, whatever their score. A protected expert is
    # reported as protected, not silently skipped.
    protected: []
    recent_window: 5

  # -- disk -> RAM cache -> resident paging ----------------------------------
  # `max_resident` must be <= `ram_cache_size`; the resident tier is a subset of
  # the RAM cache, not a peer of it.
  paging:
    enabled: false
    ram_cache_size: 32
    max_resident: 4
    policy: lru

  # -- adaptive compute ------------------------------------------------------
  # Difficulty-band boundaries as normalised 0..1 scores. Unmeasured signals are
  # EXCLUDED from the mean and renormalised rather than defaulted to zero -
  # treating "unknown" as "easy" is how a task with seven measured complexity
  # dimensions and no failure history gets routed as trivial.
  difficulty_thresholds: {}     # e.g. {easy: 0.25, medium: 0.5, hard: 0.75}

  # ==========================================================================
  # Phases A-G: measurement of whether the loop is actually working.
  # ==========================================================================
  # The premise of these settings is that MORE self-modification is not more
  # intelligence. Alpha's deficit is not insufficient self-modification - it has
  # six subsystems and one of them forbids candidates from authoring their own
  # scorer - but insufficient measurement of whether that self-modification did
  # what it claimed. Each setting below buys one more way to catch a loop that
  # looks healthy while getting worse.

  # Phase E. Subsystems that must record a verdict before a promotion is
  # approvable. A subsystem NOT listed here is not part of the quorum, so its
  # absence does not produce an unreconciled verdict - that is the difference
  # between "not applicable here" and "we forgot to ask". An entry naming an
  # unknown subsystem is a load error, because a typo would silently shorten the
  # quorum.
  required_subsystems: ["avo", "evolution_evidence", "rsi_promotion", "intelligence"]

  # Phase G. Research-proposal admission. `investigation_admission: false` is the
  # dry-run mode: proposals are ranked and reported, nothing consumes budget. A
  # proposal must also name a falsification condition and pass the Phase E
  # convergence check, which is what keeps "choose what to investigate" from
  # becoming a novelty generator.
  investigation_min_gain: 0.1
  investigation_admission: false
