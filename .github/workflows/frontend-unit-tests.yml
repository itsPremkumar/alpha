name: Frontend Unit Tests

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: frontend-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 'pnpm test' only globs src/lib/*.test.mjs, so the branding pin in
      # tests/branding.test.mjs is a separate suite ('pnpm test:branding').
      # Both run here: the branding pin exists to catch a rename regression and
      # a gate that skips it is not a gate.
      - name: Run frontend unit tests (src/lib)
        working-directory: frontend
        run: pnpm test

      - name: Run frontend branding pin
        working-directory: frontend
        run: pnpm test:branding
