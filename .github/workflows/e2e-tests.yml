name: E2E Tests (disabled - no browser suite in tree)

# DISABLED. This workflow referenced a Playwright suite that is not in the
# repository: frontend/package.json declares no @playwright/* dependency, and
# there is no playwright.config.ts, no playwright.auth.config.ts, and no
# *.spec.ts anywhere in the tree. `pnpm exec playwright test` could therefore
# only fail with "command not found", and `npx playwright install` would
# prompt to download a browser package on a runner.
#
# It is kept, disabled, rather than deleted so the removal is visible in
# review. To re-enable: add the Playwright dependency to frontend/package.json,
# commit a playwright.config.ts plus specs, then delete this banner and restore
# `on:` and the job below. Until then the offline gates (backend unit tests,
# blocking-io, lint, frontend unit tests) are the real coverage.
#
# Replace the whole file with the following when the suite returns:
#
#   on:
#     push:
#       branches: [ 'main' ]
#       paths: [ 'frontend/**' ]
#     pull_request:
#       paths: [ 'frontend/**' ]
#   jobs:
#     e2e:
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v6
#         - uses: actions/setup-node@v4
#           with: { node-version: '24' }
#         - run: corepack enable
#         - run: corepack prepare pnpm@10.26.2 --activate
#         - working-directory: frontend
#           run: pnpm install --frozen-lockfile
#         - working-directory: frontend
#           run: pnpm exec playwright install --with-deps chromium
#         - working-directory: frontend
#           run: pnpm exec playwright test
#
# The remainder of this file is the original job. The `jobs.<id>.if` guard
# below is what actually disables it: a workflow-level `if` is not valid
# GitHub Actions syntax and would fail the whole file at parse time.

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    # Disabled with the rest of this workflow: there is no Playwright suite in
    # the tree to run. See the banner at the top of this file.
    if: false  # noqa: ERA001
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm exec playwright test
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Run auth recovery E2E tests
        working-directory: frontend
        run: pnpm exec playwright test -c playwright.auth.config.ts
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
