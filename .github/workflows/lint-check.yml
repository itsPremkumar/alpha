name: Lint Check

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
  pull_request:
    branches: [ '*' ]

permissions:
  contents: read

jobs:
  compose-config:
    # docker/docker-compose.yaml must interpolate and resolve on a FRESH
    # clone (no .env): env files are optional and every bind mount source has
    # a default. A regression there breaks first-time users, not CI, unless
    # this gate exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate compose file (no .env present)
        run: docker compose -f docker/docker-compose.yaml config --quiet

  agent-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check agent guidance on pull requests
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_agent_guidance.py
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"
          --github-annotations

      - name: Check agent guidance on pushes
        if: github.event_name == 'push'
        run: >-
          python scripts/check_agent_guidance.py
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
          --github-annotations

  agent-guidance-debt-report:
    # Absolute-budget debt is measured separately so the growth-relative gate
    # above remains authoritative for touched guidance files.  This step
    # captures the checker's exit code, prints it, and labels the report
    # non-gating; it fails only if the report itself cannot be produced.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Measure full-repository AGENTS debt (non-gating report)
        run: |
          set +e
          python scripts/check_agent_guidance.py > "${{ runner.temp }}/agent-guidance-debt.txt" 2>&1
          guidance_status=$?
          set -e
          cat "${{ runner.temp }}/agent-guidance-debt.txt"
          echo "FULL-REPOSITORY AGENT-GUIDANCE DEBT REPORT (non-gating): checker_exit=$guidance_status"
          echo "The growth-relative agent-guidance job is the authoritative touched-chain gate; this report does not claim the absolute backlog is clean."
          if [ ! -s "${{ runner.temp }}/agent-guidance-debt.txt" ]; then
            echo "ERROR the guidance debt report is empty; the measurement did not run"
            exit 1
          fi

      - name: Upload agent-guidance debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-guidance-debt-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-guidance-debt.txt
          if-no-files-found: warn

  lint-backend:
    # The repository has a disclosed pre-existing Ruff debt backlog.  This is
    # an honest incremental gate: the Python files a revision changed must be
    # clean, while the separately named debt-report job below measures the
    # untouched backlog.  Every subprocess in the gate is bounded by its own
    # timeout, and the job carries timeout-minutes as the outer bound.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Check uv.lock is in sync
        working-directory: backend
        run: uv lock --check

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group dev

      - name: Gate changed Python files on pull requests
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_changed_python_lint.py
          --repo-root .
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"
          --git-timeout 120
          --ruff-timeout 300

      - name: Gate changed Python files on pushes
        if: github.event_name == 'push'
        run: >-
          python scripts/check_changed_python_lint.py
          --repo-root .
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
          --git-timeout 120
          --ruff-timeout 300

  backend-ruff-debt-report:
    # This job is a measurement, not a green-washing wrapper around lint.  Its
    # output is explicitly labelled non-gating and it captures the exit code;
    # lint-backend above is the authoritative changed-file gate.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Measure full-repository Ruff debt (non-gating report)
        working-directory: backend
        run: |
          set +e
          uv run --no-sync ruff check . --output-format=json > "${{ runner.temp }}/ruff-debt.json"
          ruff_status=$?
          set -e
          echo "FULL-REPOSITORY RUFF DEBT REPORT (non-gating): ruff_exit=$ruff_status"
          echo "The incremental lint-backend job is the authoritative changed-file gate; this report does not claim the backlog is clean."
          python - "${{ runner.temp }}/ruff-debt.json" "$ruff_status" <<'PY'
          import json
          import pathlib
          import sys
          report_path = pathlib.Path(sys.argv[1])
          status = int(sys.argv[2])
          if not report_path.is_file():
              raise SystemExit(f"Ruff debt report was not produced (exit {status})")
          try:
              findings = json.loads(report_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Ruff debt report is unreadable: {exc}")
          if not isinstance(findings, list):
              raise SystemExit("Ruff debt report is not a JSON finding list")
          print(f"findings={len(findings)}")
          PY

      - name: Upload Ruff debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ruff-debt-${{ github.run_id }}
          path: ${{ runner.temp }}/ruff-debt.json
          if-no-files-found: warn

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: |
          cd frontend
          pnpm format

      - name: Run frontend linting
        run: |
          cd frontend
          pnpm lint

      - name: Check TypeScript types
        run: |
          cd frontend
          pnpm typecheck

      - name: Build frontend
        run: |
          cd frontend
          BETTER_AUTH_SECRET=local-dev-secret pnpm build

  docs-index:
    # The documentation index is GENERATED from the docs tree, so a doc that is
    # added, renamed or removed without regenerating it leaves navigation that
    # silently rots. The generator fails on any unclassified document rather
    # than guessing a section, so this gate also catches a new doc that nobody
    # has decided where it belongs.  It is independent of the generated-drift
    # gate: that job owns contracts/feature_manifest.json, this one owns
    # docs/INDEX.md, and both are able to fail.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check the generated documentation index is current
        run: python scripts/check_docs_index_drift.py --json

  duplicate-expressions:
    # Pure-AST gate for the mangled-rename bug family: a refactor that
    # collapses `X or Y` into `X or X`, repeats one comparison inside a
    # BoolOp, writes a complementary tautology that can never fail
    # (`A != B or A == B`), or leaves a duplicate dict key behind. It
    # imports nothing, so it is safe to run while the test suite occupies
    # the venv, and it exits 1 on any hit. This job did not previously
    # exist: the check was only ever run by hand before a landing, which
    # made it a report rather than a gate, so a duplicate expression could
    # reach main without anything objecting.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reject duplicated expressions
        run: python scripts/audit_dup_expressions.py
