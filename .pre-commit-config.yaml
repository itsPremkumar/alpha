repos:
  # Backend: ruff lint + format via uv (uses the same ruff version as backend deps)
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: bash -c 'cd backend && uv run ruff check --fix "${@/#backend\//}"' --
        language: system
        types_or: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format "${@/#backend\//}"' --
        language: system
        types_or: [python]
        files: ^backend/
      - id: uv-lock-check
        name: uv lock check
        entry: bash -c 'cd backend && uv lock --check'
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|uv\.lock|packages/harness/pyproject\.toml)$

  # Frontend: use the declared TypeScript gate. ESLint and Prettier are not
  # frontend dependencies, so `npx` here downloaded unpinned tools (ESLint 10
  # with no flat config) and rewrote unrelated files before failing.
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: TypeScript typecheck (frontend)
        entry: bash -c 'cd frontend && node node_modules/typescript/bin/tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/
